[toolchain]
anchor_version = "0.31.1"

[programs.localnet]
waves_staking = "jt5JegTBVPZP8V6a48fnKYPFKTbpcTfkz91Pemur82H"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 30000

# bind_address: agave's test validator panics on the 0.0.0.0 default
# (UnspecifiedIpAddr) — loopback is required, not a preference
[test.validator]
url = "https://api.mainnet-beta.solana.com"
bind_address = "127.0.0.1"

[[test.validator.clone]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"

# Tests for the EVM contracts. Deliberately points at the existing layout
# rather than moving anything: contracts/ stays where tools/build-contract.js
# expects it, and forge output goes somewhere git ignores.
[profile.default]
src = "contracts"
test = "test"
out = "forge-out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 800
evm_version = "paris"

[fuzz]
runs = 512

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card lab</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&display=swap" rel="stylesheet">
<style>body{background:#222;margin:0;display:grid;place-items:center;min-height:100vh}
canvas{width:900px;height:472px;border:1px solid #444}</style>
</head>
<body>
<div style="display:grid;gap:20px;justify-items:center;padding:30px 0">
<canvas id="c" width="1200" height="630"></canvas>
<canvas id="x" width="1500" height="500" style="width:900px;height:300px"></canvas>
<canvas id="p" width="400" height="400" style="width:200px;height:200px;border-radius:50%"></canvas>
</div>
<script>
/* The share card, per Kyle: black, the mark huge running bottom-left to the
 * top edge, WAVES in the middle, gradient leaking in at bottom-right.
 * Drawn at exact OG size; the lab page exists so the PNG can be pulled out
 * pixel-perfect instead of screenshotting a scaled window.
 *
 * ?rh=1 draws the Robinhood Chain variant — the SAME card, only the mark's
 * gradient recoloured lime→grey (Kyle: keep everything else identical) —
 * and ?save=<name>.png POSTs the card to /api/dev-save (dev server only). */
var Q = new URLSearchParams(location.search);
var RH = Q.has("rh");
var PAL = RH
  ? { a: "#CCFF00", b: "#d9d9d9" }
  : { a: "#9945FF", b: "#14F195" };

async function draw() {
  await document.fonts.load("900 160px Archivo");
  await document.fonts.ready;
  var g = document.getElementById("c").getContext("2d");

  g.fillStyle = "#000";
  g.fillRect(0, 0, 1200, 630);

  // gradient leak, bottom-right corner — tinted to the chain
  var leak = g.createRadialGradient(1200, 630, 0, 1200, 630, 620);
  if (RH) {
    leak.addColorStop(0, "rgba(204,255,0,.32)");   // lime
    leak.addColorStop(.45, "rgba(217,217,217,.12)"); // grey
    leak.addColorStop(1, "rgba(0,0,0,0)");
  } else {
    leak.addColorStop(0, "rgba(20,241,149,.34)");   // green
    leak.addColorStop(.45, "rgba(153,69,255,.16)"); // purple
    leak.addColorStop(1, "rgba(0,0,0,0)");
  }
  g.fillStyle = leak;
  g.fillRect(0, 0, 1200, 630);

  // the mark, giant: three squares climbing from the bottom-left corner off the
  // top edge, gradient running along the climb. Drawn as a sharp logo over a
  // large blurred cast shadow, matching the launch share cards (cardmaker.js).
  function markAt(MS, x0, y0) {
    var mg = g.createLinearGradient(x0, y0 + MS, x0 + 3 * MS, y0 - 2 * MS);
    mg.addColorStop(0, PAL.a);
    mg.addColorStop(1, PAL.b);
    g.fillStyle = mg;
    [[x0, y0], [x0 + MS, y0 - MS], [x0 + 2 * MS, y0 - 2 * MS]].forEach(function (p) {
      g.fillRect(p[0], p[1], MS, MS);
    });
  }
  // blurred only — no sharp mark on top (matches the launch share cards)
  g.save();
  g.filter = "blur(52px)";
  markAt(350, 60, 515);
  g.restore();

  // WAVES dead centre of the card
  g.fillStyle = "#fff";
  g.font = "900 168px Archivo";
  g.textBaseline = "middle";
  g.textAlign = "center";
  g.letterSpacing = "-6px";
  g.fillText("WAVES", 600, 315);

  g.font = "600 30px Archivo";
  g.letterSpacing = "2px";
  g.fillStyle = "rgba(255,255,255,.62)";
  g.fillText("DEPLOY… EVERYTHING.", 600, 427);

  // @waveslaunchpad, top-right, with a soft dark shadow for legibility over the
  // bright leak — the same handle the launch share cards carry
  g.save();
  g.textAlign = "right";
  g.textBaseline = "alphabetic";
  g.font = "700 28px Archivo";
  g.letterSpacing = "0px";
  g.fillStyle = RH ? "#CCFF00" : "#14F195";   // the chain's green
  g.shadowColor = "rgba(0,0,0,.62)";
  g.shadowBlur = 12;
  g.shadowOffsetY = 1;
  g.fillText("@waveslaunchpad", 1144, 78);
  g.restore();

  // chain logo, bottom-right — the same mark the launch share cards carry
  var logo = await new Promise(function (res) {
    var im = new Image();
    im.onload = function () { res(im); };
    im.onerror = function () { res(null); };
    im.src = RH ? "/art/robinhood.svg" : "/art/solana.svg";
  });
  if (logo) {
    var lh = RH ? 54 : 42, ar = (logo.width && logo.height) ? logo.width / logo.height : 1;
    var lw = lh * ar;
    g.save();
    g.globalAlpha = 0.95;
    g.drawImage(logo, 1200 - 56 - lw, 630 - 56 - lh, lw, lh);
    g.restore();
  }

  var name = Q.get("save");
  if (name) {
    fetch("/api/dev-save", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name,
        dataUrl: document.getElementById("c").toDataURL("image/png") })
    }).then(function (r) { return r.json(); })
      .then(function (j) { console.log("dev-save", JSON.stringify(j)); });
  }
}
draw();

/* X banner: black, WAVES wall to wall */
async function drawBanner() {
  await document.fonts.load("900 400px Archivo");
  await document.fonts.ready;
  var g = document.getElementById("x").getContext("2d");
  g.fillStyle = "#000";
  g.fillRect(0, 0, 1500, 500);
  // X lays its circular PFP over the banner's bottom-left — sit vertically
  // centred but shifted right, so the circle gets clean black and the word
  // never looks pushed
  g.fillStyle = "#fff";
  g.font = "900 300px Archivo";
  g.textBaseline = "middle";
  g.textAlign = "center";
  g.letterSpacing = "-10px";
  g.fillText("WAVES", 905, 245);
}
drawBanner();

/* PFP: the mark on black, sized to survive X's circle crop */
function drawPfp() {
  var g = document.getElementById("p").getContext("2d");
  g.fillStyle = "#000";
  g.fillRect(0, 0, 400, 400);
  var S = 78, x0 = 200 - 1.5 * S, y0 = 200 + 1.5 * S - S;
  var mg = g.createLinearGradient(x0, y0 + S, x0 + 3 * S, y0 - 2 * S);
  mg.addColorStop(0, "#9945FF");
  mg.addColorStop(1, "#14F195");
  g.fillStyle = mg;
  [[x0, y0], [x0 + S, y0 - S], [x0 + 2 * S, y0 - 2 * S]].forEach(function (pt) {
    g.fillRect(pt[0], pt[1], S, S);
  });
}
drawPfp();
</script>
</body>
</html>

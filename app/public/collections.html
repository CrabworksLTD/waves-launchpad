<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAVES Launchpad</title>
<meta name="description" content="Cross-chain token and NFT launchpad">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
/* The collections marketplace, after Moonpad's: heading + filter chips, a
 * grid of tiles with live mint progress, skeletons while the chain answers,
 * and an empty state that sells the launch button. Names and addresses come
 * from our records; supply, minted and price are read from the machine —
 * numbers we could fake are numbers nobody trusts. */
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;min-height:100%}
body{background:var(--void);color:var(--ink);font:400 15px/1.6 Inter,sans-serif;
  -webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",monospace}
a{color:inherit;text-decoration:none}
main{max-width:1400px;margin:0 auto;padding:44px 24px 90px}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  flex-wrap:wrap;margin-bottom:26px}
h1{font-family:Archivo;font-size:clamp(28px,3.6vw,44px);font-weight:800;
  letter-spacing:-.02em;margin:0 0 6px}
.lede{color:var(--dim);margin:0;max-width:56ch;font-size:14.5px}
/* the explore panel — same treatment as the token marketplace */
.panel{position:relative;border:1px solid transparent;border-radius:20px;
  padding:26px 26px 30px;overflow:hidden;
  background:linear-gradient(var(--void),var(--void)) padding-box,
             var(--grad) border-box}
.panel::before,.panel::after{content:"";position:absolute;pointer-events:none;
  width:520px;height:420px;opacity:.45}
.panel::before{top:-190px;left:-160px;
  background:radial-gradient(closest-side,rgba(var(--grad-a-rgb),.7),transparent)}
.panel::after{bottom:-190px;right:-160px;
  background:radial-gradient(closest-side,rgba(var(--grad-b-rgb),.6),transparent)}
.panel>*{position:relative;z-index:1}
.count{display:inline-block;margin-left:12px;padding:5px 14px;border-radius:99px;
  background:var(--panel2);border:1px solid var(--line);vertical-align:middle;
  font:500 13px "IBM Plex Mono",monospace;color:var(--dim)}
.seg{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line)}
.seg button{padding:9px 16px;border:0;border-radius:999px;background:transparent;
  color:var(--dim);font:600 13px Inter,sans-serif;cursor:pointer;white-space:nowrap;
  transition:color .18s,background .18s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel2);color:var(--ink)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* search — same pill rail as .seg so the heights can't drift apart. Stays an
   icon until you need it, so it costs no room on a page about browsing. */
.srch{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);transition:border-color .18s}
.srch:focus-within{border-color:var(--faint)}
.srch button{width:34px;height:34px;flex:none;display:grid;place-items:center;
  padding:0;border:0;border-radius:999px;background:transparent;color:var(--dim);
  cursor:pointer;transition:color .18s}
.srch button:hover,.srch.open button{color:var(--ink)}
.srch svg{width:16px;height:16px;display:block}
.srch input{width:0;min-width:0;padding:0;border:0;background:transparent;
  color:var(--ink);font:500 13px Inter,sans-serif;outline:0;
  transition:width .22s ease,padding .22s ease}
.srch.open input{width:172px;padding:0 10px 0 2px}
.srch input::placeholder{color:var(--faint)}
@media (prefers-reduced-motion:reduce){.srch input{transition:none}}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 16px;border:1px solid var(--line2);background:transparent;
  color:var(--dim);font:600 12.5px Inter;cursor:pointer;border-radius:999px;
  transition:color .2s,border-color .2s}
.chip:hover{color:var(--ink)}
.chip.on{color:var(--accent);border-color:rgba(var(--accent-rgb),.45)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.tile{display:block;position:relative;border:1px solid rgba(255,255,255,.16);
  border-radius:6px;overflow:hidden;background:var(--panel);
  transition:border-color .25s,transform .25s}
.tile:hover{border-color:var(--faint);transform:translateY(-3px)}
.shot{position:relative;aspect-ratio:1;background:var(--bg);overflow:hidden;
  border-bottom:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}
.shot .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);
  font:500 10px "IBM Plex Mono",monospace;letter-spacing:.18em;text-transform:uppercase}
.tag{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:99px;
  font:700 9.5px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(0,0,0,.72);backdrop-filter:blur(6px);border:1px solid var(--line2)}
.tag.live{color:var(--accent);border-color:rgba(var(--accent-rgb),.45)}
.tag.out{color:var(--faint)}
.tag.soon{color:var(--dim)}
.body{padding:14px 15px 15px}
.body h2{margin:0;font-family:Archivo;font-size:15.5px;font-weight:700;line-height:1.25;
  letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body .sym{margin:3px 0 12px;color:var(--faint);font:400 11px "IBM Plex Mono",monospace}
.bar{height:5px;border-radius:99px;background:var(--raise);overflow:hidden}
.bar i{display:block;height:100%;width:0;
  background-image:var(--grad);background-repeat:no-repeat;
  background-size:calc(100% + 2px) 100%;background-position:-1px 0;
  transition:width .5s}
.nums{display:flex;justify-content:space-between;gap:10px;margin-top:9px;
  font:400 11px "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--faint)}
.nums b{color:var(--ink);font-weight:600}

.skel{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.skel .s{background:linear-gradient(100deg,var(--panel) 30%,var(--panel2) 50%,var(--panel) 70%);
  background-size:220% 100%;animation:sh 1.5s linear infinite}
.skel .s.a{aspect-ratio:1}
.skel .s.b{height:12px;margin:14px 16px;border-radius:4px}
@keyframes sh{to{background-position:-220% 0}}
@media (prefers-reduced-motion:reduce){.skel .s{animation:none}.tile{transition:none}}

.empty{border:1px dashed var(--line2);border-radius:8px;padding:52px 26px;text-align:center}
.empty h3{margin:0 0 8px;font-family:Archivo;font-size:20px;font-weight:800;letter-spacing:-.015em}
.empty p{margin:0 auto 22px;color:var(--dim);font-size:14px;max-width:46ch}
.empty a{display:inline-block;padding:12px 26px;border-radius:999px;
  font:700 13.5px Archivo;color:var(--accent-ink);
  background-image:var(--grad);background-repeat:no-repeat;
  background-size:calc(100% + 2px) 100%;background-position:-1px 0}
.note{margin-top:28px;color:var(--faint);font:400 12px "IBM Plex Mono",monospace;text-align:center}
</style>
</head>
<body>
<main>
  <div class="panel">
  <div class="head">
    <div>
      <h1 class="disp">Collections<span class="count" id="count" hidden></span></h1>
      <p class="lede">Every collection launched here. Supply, minted and price are
      read from the chain when the page loads — not from a database we curate.</p>
    </div>
    <div class="controls">
      <div class="srch" id="srch">
        <button type="button" id="srch-btn" aria-label="Search collections" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        </button>
        <input id="srch-in" type="text" placeholder="Name or address"
          autocomplete="off" spellcheck="false" aria-label="Search collections">
      </div>
      <div class="seg" id="sort">
        <button data-s="progress" class="on">Closest to minting out</button>
        <button data-s="minted">Most minted</button>
        <button data-s="newest">Newest</button>
        <button data-s="oldest">Oldest</button>
      </div>
      <div class="seg" id="filters">
        <button class="on" data-f="all">All</button>
        <button data-f="live">Minting</button>
        <button data-f="out">Sold out</button>
      </div>
    </div>
  </div>

  <div class="grid" id="skel">
    <div class="skel"><div class="s a"></div><div class="s b"></div><div class="s b" style="width:40%"></div></div>
    <div class="skel"><div class="s a"></div><div class="s b"></div><div class="s b" style="width:40%"></div></div>
    <div class="skel"><div class="s a"></div><div class="s b"></div><div class="s b" style="width:40%"></div></div>
    <div class="skel"><div class="s a"></div><div class="s b"></div><div class="s b" style="width:40%"></div></div>
  </div>

  <div class="grid" id="grid" hidden></div>

  <div class="empty" id="empty" hidden>
    <h3>Nothing here yet</h3>
    <p>No collections have launched on this deployment. The first one gets the
    whole marketplace to itself.</p>
    <a href="/launch?mode=collection">Launch the first →</a>
  </div>
  <p class="note" id="note" hidden></p>
  </div>
</main>

<script src="/brand.js"></script>
<script src="/ui.js"></script>
<script src="/wallet.js"></script>
<script src="/shell.js"></script>
<script src="/launch.js"></script>
<script>
(function () {
  "use strict";
  var esc = UI.esc, shortAddr = UI.shortAddr;
  Shell.mount({ active: "explore", search: true });
  var qs = new URLSearchParams(location.search);
  if (qs.get("cluster")) window.Launch.cluster(qs.get("cluster"));

  var $ = function (id) { return document.getElementById(id); };
  var state = [];                                  // {rec, machine|null}
  var filter = "all";
  var sort = "progress";
  var query = "";

  var EVM = window.Shell.chain && window.Shell.chain() === "robinhood";

  function loadScripts(list) {
    return list.reduce(function (p, src) {
      return p.then(function () {
        return new Promise(function (res, rej) {
          var el = document.createElement("script");
          el.src = src; el.onload = res;
          el.onerror = function () { rej(new Error("failed to load " + src)); };
          document.head.appendChild(el);
        });
      });
    }, Promise.resolve());
  }

  /* Both chains list from OUR records — WAVES only shows what launched on
   * WAVES. The live numbers still come off the chain the record names. */
  fetch("/api/collections").then(function (r) { return r.json(); })
    .then(function (j) { return (j.collections || []); })
    .catch(function () { return []; })
    .then(function (records) {
      var mine = records.filter(function (c) {
        return EVM ? c.chain === "robinhood" : c.chain !== "robinhood";
      });
      return EVM ? loadEvm(mine) : load(mine);
    });

  function loadEvm(records) {
    $("skel").hidden = true;
    if (!records.length) { $("empty").hidden = false; return; }
    loadScripts(["/evm-chains.js", "/evm-contract.js", "/evm-collections.js"])
      .then(function () {
        state = records.map(function (rec) {
          rec.id = rec.address;
          return { rec: rec, m: null };
        });
        $("grid").hidden = false;
        draw();
        state.forEach(function (row) {
          window.EvmCollections.readOne(row.rec.id).then(function (c) {
            if (!row.rec.name) row.rec.name = c.name;
            row.m = {
              redeemed: c.minted, available: c.maxSupply, open: c.saleOpen,
              priceText: c.price === 0n ? "free"
                : "<b>" + window.EvmCollections.fmtEth(c.price) + "</b> ETH"
            };
            draw();
            if (row.rec.avatar) return null;
            return window.EvmCollections.artFor(c);
          }).then(function (art) {
            if (art) { row.rec.avatar = art; draw(); }
          }).catch(function () {});
        });
      })
      .catch(function () { $("empty").hidden = false; });
  }

  function load(records) {
    $("skel").hidden = true;
    if (!records.length) { $("empty").hidden = false; return; }
    state = records.map(function (rec) {
      rec.id = rec.candyMachine;
      return { rec: rec, m: null };
    });
    $("count").textContent = records.length.toLocaleString() + " launched";
    $("count").hidden = false;
    $("grid").hidden = false;
    draw();
    // machines are read after first paint — names render instantly, numbers
    // stream in as the chain answers
    state.forEach(function (row) {
      window.Launch.readMachine(row.rec.candyMachine).then(function (m) {
        row.m = m; draw();
      }).catch(function () {});
    });
  }

  function tag(row) {
    if (!row.m) return "";
    var out = row.m.redeemed >= row.m.available;
    var closed = !out && row.m.open === false;
    return '<span class="tag ' + (out ? "out" : closed ? "soon" : "live") + '">' +
      (out ? "Sold out" : closed ? "Not open" : "Minting") + "</span>";
  }

  function visible(row) {
    if (query) {
      var hay = ((row.rec.name || "") + " " + (row.rec.symbol || "") + " " +
                 (row.rec.candyMachine || "")).toLowerCase();
      if (hay.indexOf(query) < 0) return false;
    }
    if (filter === "all") return true;
    if (!row.m) return filter === "live";          // unknown counts as minting
    var out = row.m.redeemed >= row.m.available;
    return filter === "out" ? out : !out;
  }

  /* Ordering, same rule as the token marketplace: the default answers the
   * question the page is for — what is about to sell out — and finished
   * collections rank below the ones still minting. */
  function frac(row) {
    var m = row.m;
    if (!m || !m.available) return -1;
    return m.redeemed / m.available;
  }
  function ordered(rows) {
    var out = rows.slice();
    if (sort === "newest" || sort === "oldest") {
      out.sort(function (a, b) {
        var d = (b.rec.at || 0) - (a.rec.at || 0);
        return sort === "newest" ? d : -d;
      });
      return out;
    }
    if (sort === "minted") {
      out.sort(function (a, b) {
        return ((b.m && b.m.redeemed) || -1) - ((a.m && a.m.redeemed) || -1);
      });
      return out;
    }
    out.sort(function (a, b) {
      var fa = frac(a), fb = frac(b);
      var da = fa >= 1, db = fb >= 1;
      if (da !== db) return da ? 1 : -1;
      return fb - fa;
    });
    return out;
  }

  function draw() {
    $("grid").innerHTML = ordered(state.filter(visible)).map(function (row) {
      var r = row.rec, m = row.m;
      var pct = m && m.available ? Math.min(100, 100 * m.redeemed / m.available) : 0;
      var price = "";
      if (m) {
        if (EVM) price = m.priceText || "";
        else if (m.priceSol != null)
          price = m.priceSol === 0 ? "free" : "<b>" + m.priceSol + "</b> SOL";
      }
      return '<a class="tile" data-name="' + esc(r.name) + '" href="/mint/' + esc(r.id) + '">' +
        '<div class="shot">' +
          (r.avatar ? '<img alt="" loading="lazy" src="' + esc(r.avatar) + '">'
                    : '<span class="none">no art</span>') +
          tag(row) + "</div>" +
        '<div class="body"><h2>' + esc(r.name) + "</h2>" +
        '<p class="sym mono">' + esc(shortAddr(r.id)) + "</p>" +
        '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
        '<div class="nums"><span>' +
          (m ? "<b>" + m.redeemed.toLocaleString() + "</b> / " + m.available.toLocaleString()
             : "reading chain…") + "</span><span>" + price +
        "</span></div></div></a>";
    }).join("") || "";
    if (!$("grid").innerHTML) {
      $("grid").innerHTML = '<p class="note" style="grid-column:1/-1">' +
        (query ? "No collection matches “" + esc(query) + "”."
               : "Nothing matches that filter.") + "</p>";
    }
  }

  /* Search. The shell has a global search box too, so both write through the
   * same setter — otherwise the two could disagree about what is filtered. */
  var srch = $("srch"), srchIn = $("srch-in"), srchBtn = $("srch-btn");
  function open(on) {
    srch.classList.toggle("open", on);
    srchBtn.setAttribute("aria-expanded", on ? "true" : "false");
  }
  function setQuery(q, echo) {
    query = (q || "").trim().toLowerCase();
    if (echo) { srchIn.value = q || ""; if (query) open(true); }
    draw();
  }
  srchBtn.addEventListener("click", function () {
    if (srch.classList.contains("open")) {
      open(false);
      if (query) setQuery("", true);
    } else { open(true); srchIn.focus(); }
  });
  srchIn.addEventListener("input", function () { setQuery(srchIn.value); });
  srchIn.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    setQuery("", true); open(false); srchIn.blur();
  });
  // collapse on the way out, but only if it is empty — otherwise the filter
  // would still be applied with nothing on screen explaining why
  srchIn.addEventListener("blur", function () { if (!query) open(false); });

  function segClick(id, apply) {
    $(id).addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      apply(b);
      [].forEach.call($(id).children, function (x) { x.classList.toggle("on", x === b); });
      draw();
    });
  }
  segClick("filters", function (b) { filter = b.dataset.f; });
  segClick("sort", function (b) { sort = b.dataset.s; });

  document.addEventListener("shell:search", function (e) {
    setQuery(e.detail.query || "", true);
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUNPAD — NFT design and deployment on Solana</title>
<meta name="description" content="Draw the traits, generate the collection, launch it on Solana.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SUNPAD">
<meta property="og:title" content="SUNPAD">
<meta property="og:description" content="Draw the traits, generate the collection, launch it on Solana.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SUNPAD">
<meta name="twitter:description" content="Draw the traits, generate the collection, launch it on Solana.">
<meta name="theme-color" content="#07060b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
/* Homepage: two ranked lists — collections and tokens — and the shared shell.
   Page-level chrome (the bar, wallet, search) lives in shell.js, not here. */

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--void);color:var(--ink);
  font:400 15px/1.6 Inter,ui-sans-serif,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.disp{font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
a{color:inherit;text-decoration:none}

main{max-width:1240px;margin:0 auto;padding:28px 20px 90px}

/* ---- category tabs ---- */
.tabs{display:flex;align-items:center;gap:6px;margin-bottom:22px}
.tab{font:600 15px "Space Grotesk",sans-serif;letter-spacing:-.01em;cursor:pointer;
  padding:9px 16px;border-radius:10px;border:0;background:transparent;color:var(--faint);
  transition:color .18s,background .18s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--panel2)}
.tabs .count{margin-left:auto;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);border:1px solid var(--line);border-radius:99px;
  padding:5px 11px;white-space:nowrap}

/* ---- cards ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;display:block;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.card .thumb{aspect-ratio:1;background:var(--bg);display:block;position:relative}
.card .thumb canvas{width:100%;height:100%;display:block;image-rendering:pixelated;
  transition:opacity .3s ease}
.card .thumb canvas.swap{opacity:.15}
.card .meta{padding:12px 14px 14px}
.card .meta b{display:block;font-family:"Space Grotesk";font-size:14.5px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta span{display:block;margin-top:3px;font-size:12px;color:var(--faint)}
.card.hide{display:none}

/* token tiles: same card, typographic thumb — a token has no art of its own,
   and inventing some would make fake art the face of real money */
.card .tok{position:absolute;inset:0;display:grid;place-items:center}
.card .tok b{font-family:"Space Grotesk";font-size:26px;font-weight:700;
  letter-spacing:-.02em;color:var(--dim)}
.card .tok i{position:absolute;left:14px;bottom:12px;font-style:normal;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

/* ---- empty state: honest, not decorated ---- */
.none{grid-column:1/-1;border:1px dashed var(--line2);border-radius:14px;
  padding:48px 24px;text-align:center}
.none p{margin:0 0 6px;font-family:"Space Grotesk";font-size:16px;font-weight:600}
.none span{color:var(--faint);font-size:13px}
.none a{display:inline-block;margin-top:18px;padding:11px 22px;border-radius:999px;
  font:600 13.5px "Space Grotesk",sans-serif;background:var(--raise);
  border:1px solid var(--line2);transition:background .2s,border-color .2s}
.none a:hover{background:var(--panel2);border-color:var(--faint)}
.nomatch{grid-column:1/-1;color:var(--faint);font-size:13.5px;padding:32px 0;text-align:center}

footer{border-top:1px solid var(--line);margin-top:90px;padding:26px 0 60px;
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-size:12.5px;color:var(--faint)}
</style>
</head>
<body>

<main>
  <div class="tabs" role="tablist" aria-label="Categories">
    <button class="tab" id="tab-collections" role="tab" aria-selected="true"
            aria-controls="cards">Top Collections</button>
    <button class="tab" id="tab-tokens" role="tab" aria-selected="false"
            aria-controls="cards">Top Tokens</button>
    <span class="count mono" id="count">—</span>
  </div>

  <div class="cards" id="cards" role="tabpanel"></div>

  <footer>
    <span>Built on Metaplex Core and Meteora. We take no cut of your mint.</span>
    <span><a href="/app">Editor</a></span>
  </footer>
</main>

<script src="/brand.js"></script>
<script src="/ui.js"></script>
<script src="/wallet.js"></script>
<script src="/shell.js"></script>
<script>
(function () {
  "use strict";
  var H = UI.html, raw = UI.raw, render = UI.render, on = UI.on,
      shortAddr = UI.shortAddr;

  Shell.mount({ active: "collections", search: true });

  var cards = document.getElementById("cards");
  var count = document.getElementById("count");
  var state = {
    tab: location.hash === "#tokens" ? "tokens" : "collections",
    query: "",
    collections: null,   // null = loading, [] = confirmed empty
    tokens: null,
    templates: null,
    rerolls: []          // live-generated template canvases
  };

  /* ---------------- template art (collections empty-state) ---------------- */

  function loadTemplate(file) {
    return fetch("/templates/" + file).then(function (r) { return r.json(); })
      .then(function (doc) {
        return Promise.all(doc.project.categories.map(function (c) {
          return Promise.all(c.traits.map(function (t) {
            return new Promise(function (res) {
              var im = new Image();
              im.onload = function () { res({ img: im, w: t.weight || 1 }); };
              im.onerror = function () { res(null); };
              im.src = t.image;
            });
          })).then(function (l) { return l.filter(Boolean); });
        })).then(function (loaded) {
          return { cats: loaded.filter(function (c) { return c.length; }),
                   cell: (doc.project.canvas && doc.project.canvas.pixel) || 24 };
        });
      });
  }
  function pickFrom(list) {
    var total = 0, i;
    for (i = 0; i < list.length; i++) total += list[i].w;
    var r = Math.random() * total;
    for (i = 0; i < list.length; i++) { r -= list[i].w; if (r <= 0) return list[i].img; }
    return list[list.length - 1].img;
  }
  function paint(cv, t) {
    cv.width = cv.height = t.cell;
    var g = cv.getContext("2d");
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, t.cell, t.cell);
    for (var i = 0; i < t.cats.length; i++) g.drawImage(pickFrom(t.cats[i]), 0, 0, t.cell, t.cell);
  }

  // One reroll loop for the life of the page. Cards register into
  // state.rerolls when drawn; hidden or removed canvases are skipped, so tab
  // switches and searches never leave the timer painting into nothing.
  setInterval(function () {
    var live = state.rerolls.filter(function (r) {
      return r.cv.isConnected && !r.cv.closest(".card").classList.contains("hide");
    });
    if (!live.length) return;
    var pick = live[(Math.random() * live.length) | 0];
    pick.cv.classList.add("swap");
    setTimeout(function () {
      if (pick.cv.isConnected) { paint(pick.cv, pick.tp); pick.cv.classList.remove("swap"); }
    }, 300);
  }, 1400);

  /* ---------------- data ---------------- */

  function getJson(url, key) {
    return fetch(url).then(function (r) { return r.json(); })
      .then(function (j) { return (j && j[key]) || []; })
      .catch(function () { return []; });
  }

  Promise.all([
    getJson("/api/collections", "collections"),
    getJson("/api/tokens", "tokens"),
    getJson("/templates/index.json", "templates")
  ]).then(function (r) {
    state.collections = r[0];
    state.tokens = r[1];
    state.templates = r[2];
    draw();
  });

  /* ---------------- render ---------------- */

  function collectionCard(c) {
    return H`<a class="card" data-name="${c.name}" href="/mint/${c.candyMachine}">
      <div class="thumb"></div>
      <div class="meta"><b>${c.name}</b>
      <span class="mono">${shortAddr(c.candyMachine)}</span></div></a>`;
  }

  function templateCard(t) {
    return H`<a class="card" data-name="${t.name}" data-tpl="${t.file}" href="/app">
      <div class="thumb"><canvas></canvas></div>
      <div class="meta"><b>${t.name}</b>
      <span>${t.traits} traits · ${t.categories} categories</span></div></a>`;
  }

  function tokenCard(t) {
    // Jupiter link: real and useful today. A /token/<mint> page can replace
    // the href later without touching the card.
    return H`<a class="card" data-name="${t.name + " " + t.symbol}"
        href="https://jup.ag/swap/SOL-${t.mint}" target="_blank" rel="noopener">
      <div class="thumb"><div class="tok"><b>${"$" + (t.symbol || "?")}</b>
        <i>token</i></div></div>
      <div class="meta"><b>${t.name}</b>
      <span class="mono">${shortAddr(t.mint)}</span></div></a>`;
  }

  function emptyTokens() {
    return H`<div class="none">
      <p class="disp">No tokens launched yet</p>
      <span>The first token launched here gets this whole page to itself.</span><br>
      <a href="/app">Launch the first →</a></div>`;
  }

  function draw() {
    var isTok = state.tab === "tokens";
    document.getElementById("tab-collections").setAttribute("aria-selected", String(!isTok));
    document.getElementById("tab-tokens").setAttribute("aria-selected", String(isTok));
    state.rerolls = [];

    if (isTok) {
      if (!state.tokens || !state.tokens.length) {
        count.textContent = "0 tokens";
        render(cards, emptyTokens());
      } else {
        count.textContent = state.tokens.length + (state.tokens.length === 1 ? " token" : " tokens");
        render(cards, H`${state.tokens.map(tokenCard)}`);
      }
    } else {
      var live = state.collections && state.collections.length;
      if (live) {
        count.textContent = state.collections.length +
          (state.collections.length === 1 ? " collection" : " collections");
        render(cards, H`${state.collections.map(collectionCard)}`);
      } else {
        // Ranked list with nothing to rank: show the starting points rather
        // than an empty grid — the most damaging thing a launchpad homepage
        // can display is nothing.
        count.textContent = "starting points";
        var t = state.templates || [];
        render(cards, H`${t.map(templateCard)}`);
        t.forEach(function (x, i) {
          var cv = cards.children[i] && cards.children[i].querySelector("canvas");
          if (!cv) return;
          loadTemplate(x.file).then(function (tp) {
            paint(cv, tp);
            state.rerolls.push({ cv: cv, tp: tp });
          }).catch(function () {});
        });
      }
    }
    applyFilter();
  }

  /* ---------------- tabs + search ---------------- */

  function setTab(tab) {
    if (state.tab === tab) return;
    state.tab = tab;
    // deep-linkable without polluting history on every switch
    history.replaceState(null, "", tab === "tokens" ? "#tokens" : location.pathname);
    draw();
  }
  document.getElementById("tab-collections").addEventListener("click", function () { setTab("collections"); });
  document.getElementById("tab-tokens").addEventListener("click", function () { setTab("tokens"); });

  function applyFilter() {
    var q = state.query.trim().toLowerCase();
    var all = cards.querySelectorAll(".card");
    var shown = 0;
    all.forEach(function (c) {
      var hit = !q || (c.dataset.name || "").toLowerCase().indexOf(q) >= 0;
      c.classList.toggle("hide", !hit);
      if (hit) shown++;
    });
    var prev = cards.querySelector(".nomatch");
    if (prev) prev.remove();
    if (all.length && !shown) {
      cards.insertAdjacentHTML("beforeend", '<p class="nomatch">Nothing matches that.</p>');
    }
  }
  document.addEventListener("shell:search", function (e) {
    state.query = e.detail.query || "";
    applyFilter();
  });
})();
</script>
</body>
</html>

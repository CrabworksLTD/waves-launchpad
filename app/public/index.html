<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUNPAD — NFT design and deployment on Solana</title>
<meta name="description" content="Draw the traits, generate the collection, launch it on Solana.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SUNPAD">
<meta property="og:title" content="SUNPAD">
<meta property="og:description" content="Draw the traits, generate the collection, launch it on Solana.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SUNPAD">
<meta name="twitter:description" content="Draw the traits, generate the collection, launch it on Solana.">
<meta name="theme-color" content="#07060b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
/* Homepage: a title, a button, and the collections. That is the whole page.
 *
 * Everything else — how it works, pricing, the four steps — was true but did
 * not belong here. A launchpad homepage is a shop window, and the shop window
 * is the work, not an explanation of the shop.
 *
 * Flat black, no background treatment, no gradient type. The only gradient
 * left is the rail's mark and its + button, which is what makes those read as
 * the actions rather than as more decoration. */

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--void);color:var(--ink);
  font:400 15px/1.65 Inter,ui-sans-serif,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.disp{font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
a{color:inherit}

/* ---- rail ---- */
.rail{position:fixed;left:0;top:0;bottom:0;width:60px;z-index:5;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0;
  background:var(--void);border-right:1px solid var(--line)}
.mark{width:32px;height:32px;border-radius:10px;background:var(--grad);
  display:grid;place-items:center;margin-bottom:14px;flex:none;
  font-family:"Space Grotesk";font-weight:700;font-size:15px;color:var(--accent-ink);
  text-decoration:none}
.rail a.ico{position:relative;width:40px;height:40px;border-radius:11px;flex:none;
  display:grid;place-items:center;color:var(--faint);text-decoration:none;
  transition:color .18s,background .18s}
.rail a.ico:hover{color:var(--ink);background:var(--panel2)}
.rail a.ico.cta{background:var(--grad);color:var(--accent-ink);margin:10px 0}
.rail a.ico.cta:hover{background:var(--grad-hi);color:var(--accent-ink)}
.rail a.ico svg{width:19px;height:19px;stroke:currentColor;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* label lives in data-label so the tooltip and the aria-label are one string */
.rail a.ico::after{content:attr(data-label);position:absolute;left:calc(100% + 12px);
  padding:7px 11px;border-radius:9px;white-space:nowrap;font-size:12.5px;
  background:var(--raise);border:1px solid var(--line2);color:var(--ink);
  opacity:0;transform:translateX(-4px);pointer-events:none;
  transition:opacity .16s,transform .16s}
.rail a.ico:hover::after{opacity:1;transform:translateX(0)}
.rail .spacer{flex:1}

.wrap{max-width:1120px;margin:0 auto;padding:0 32px 0 92px}

/* ---- hero: title and one button ---- */
.hero{text-align:center;padding:120px 0 84px}
h1{font-family:"Space Grotesk";font-size:clamp(34px,5vw,58px);line-height:1.05;
  font-weight:600;letter-spacing:-.035em;margin:0;text-wrap:balance}
.btn{display:inline-flex;align-items:center;gap:9px;margin-top:30px;
  padding:14px 28px;border-radius:999px;
  font:600 14.5px "Space Grotesk",sans-serif;text-decoration:none;cursor:pointer;
  background:var(--raise);color:var(--ink);border:1px solid var(--line2);
  transition:background .2s,border-color .2s}
.btn:hover{background:var(--panel2);border-color:var(--faint)}

/* ---- collections ---- */
.colhead{display:flex;align-items:baseline;justify-content:space-between;
  gap:20px;margin-bottom:22px}
h2{font-family:"Space Grotesk";font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0}
.pill{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  border:1px solid var(--line);border-radius:99px;padding:5px 11px;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;text-decoration:none;display:block;
  transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.card .thumb{aspect-ratio:1;background:var(--bg);display:block}
.card .thumb canvas{width:100%;height:100%;display:block;image-rendering:pixelated;
  transition:opacity .3s ease}
.card .thumb canvas.swap{opacity:.15}
.card .meta{padding:12px 14px 14px}
.card .meta b{display:block;font-family:"Space Grotesk";font-size:14.5px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta span{display:block;margin-top:3px;font-size:12px;color:var(--faint)}

footer{border-top:1px solid var(--line);margin-top:110px;padding:26px 0 60px;
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-size:12.5px;color:var(--faint)}

@media (max-width:720px){
  .rail{top:auto;right:0;bottom:0;width:auto;height:58px;flex-direction:row;
    justify-content:center;gap:6px;padding:0 10px;border-right:0;border-top:1px solid var(--line)}
  .mark{margin:0 8px 0 0}
  .rail .spacer{display:none}
  .rail a.ico.cta{margin:0 4px}
  .rail a.ico::after{left:50%;bottom:calc(100% + 10px);transform:translate(-50%,4px)}
  .rail a.ico:hover::after{transform:translate(-50%,0)}
  .wrap{padding:0 20px 78px}
  .hero{padding:72px 0 56px}
}
</style>
</head>
<body>

<nav class="rail" aria-label="Main">
  <a class="mark" href="/" aria-label="Sunpad home">S</a>
  <a class="ico" href="/app" data-label="Editor" aria-label="Editor">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </a>
  <a class="ico" href="#collections" data-label="Collections" aria-label="Collections">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
  </a>
  <a class="ico cta" href="/app" data-label="New collection" aria-label="New collection">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
  </a>
  <span class="spacer"></span>
</nav>

<div class="wrap">

  <header class="hero">
    <h1 class="disp">Draw thirty traits.<br>Ship ten thousand.</h1>
    <a class="btn" href="/app">Start drawing →</a>
  </header>

  <section id="collections">
    <div class="colhead">
      <h2 class="disp">Collections</h2>
      <span class="pill mono" id="colcount">—</span>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <footer>
    <span>Built on Metaplex Core. We take no cut of your mint.</span>
    <span><a href="/app">Editor</a></span>
  </footer>
</div>

<script src="/brand.js"></script>
<script>
/* Composite one random token from a template — real generated art on every
   card, not a placeholder rectangle. The cards reroll on a slow stagger, which
   is where the live-generation idea ended up: folded into the collections grid
   instead of sitting in a second panel doing the same job. */
function loadTemplate(file) {
  return fetch("/templates/" + file).then(function (r) { return r.json(); })
    .then(function (doc) {
      return Promise.all(doc.project.categories.map(function (c) {
        return Promise.all(c.traits.map(function (t) {
          return new Promise(function (res) {
            var im = new Image();
            im.onload = function () { res({ img: im, w: t.weight || 1 }); };
            im.onerror = function () { res(null); };
            im.src = t.image;
          });
        })).then(function (l) { return l.filter(Boolean); });
      })).then(function (loaded) {
        return { cats: loaded.filter(function (c) { return c.length; }),
                 cell: (doc.project.canvas && doc.project.canvas.pixel) || 24 };
      });
    });
}
function pickFrom(list) {
  var total = 0, i;
  for (i = 0; i < list.length; i++) total += list[i].w;
  var r = Math.random() * total;
  for (i = 0; i < list.length; i++) { r -= list[i].w; if (r <= 0) return list[i].img; }
  return list[list.length - 1].img;
}
function paint(cv, t) {
  cv.width = cv.height = t.cell;
  var g = cv.getContext("2d");
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, t.cell, t.cell);
  for (var i = 0; i < t.cats.length; i++) g.drawImage(pickFrom(t.cats[i]), 0, 0, t.cell, t.cell);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* One component, two sources: real launches when there are any, the bundled
   templates when there are not. An empty grid is the most damaging thing a
   launchpad homepage can show, and on day one there will be none. */
(function () {
  var cards = document.getElementById("cards"), count = document.getElementById("colcount");

  fetch("/api/collections").then(function (r) { return r.json(); })
    .then(function (j) { return (j && j.collections) || []; })
    .catch(function () { return []; })
    .then(function (list) { list.length ? live(list) : starters(); });

  function live(list) {
    count.textContent = list.length + (list.length === 1 ? " collection" : " collections");
    cards.innerHTML = list.slice(0, 12).map(function (c) {
      return '<a class="card" href="/mint/' + esc(c.candyMachine) + '">' +
        '<div class="thumb"></div><div class="meta"><b>' + esc(c.name) + "</b>" +
        '<span class="mono">' + esc(c.candyMachine.slice(0, 4)) + "…" +
        esc(c.candyMachine.slice(-4)) + "</span></div></a>";
    }).join("");
  }

  function starters() {
    count.textContent = "starting points";
    fetch("/templates/index.json").then(function (r) { return r.json(); })
      .then(function (j) {
        var t = (j.templates || []).slice(0, 8);
        cards.innerHTML = t.map(function (x) {
          return '<a class="card" href="/app"><div class="thumb"><canvas></canvas></div>' +
            '<div class="meta"><b>' + esc(x.name) + "</b><span>" +
            esc(x.traits) + " traits · " + esc(x.categories) + " categories</span></div></a>";
        }).join("");

        var loaded = [];
        t.forEach(function (x, i) {
          var cv = cards.children[i] && cards.children[i].querySelector("canvas");
          if (!cv) return;
          loadTemplate(x.file).then(function (tp) {
            paint(cv, tp);
            loaded.push({ cv: cv, tp: tp });
          }).catch(function () {});
        });

        // Slow, one at a time. Rerolling the grid together strobes, and fast
        // enough to notice reads as a broken carousel rather than as work.
        setInterval(function () {
          if (!loaded.length) return;
          var pick = loaded[(Math.random() * loaded.length) | 0];
          pick.cv.classList.add("swap");
          setTimeout(function () {
            paint(pick.cv, pick.tp);
            pick.cv.classList.remove("swap");
          }, 300);
        }, 1400);
      }).catch(function () { cards.innerHTML = ""; });
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUNPAD — NFT design and deployment on Solana</title>
<meta name="description" content="Draw the traits, generate the collection, launch it on Solana.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SUNPAD">
<meta property="og:title" content="SUNPAD">
<meta property="og:description" content="Draw the traits, generate the collection, launch it on Solana.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SUNPAD">
<meta name="twitter:description" content="Draw the traits, generate the collection, launch it on Solana.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
/* Homepage, rebuilt against the reference: true black, one big white
 * statement, one gradient pill, then the work at full width — wide banner
 * tiles with the art edge to edge and the name INSIDE the tile, not captioned
 * under it. The banners are composited live from the templates by the real
 * generator, so every tile is art the tool actually made. */

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--void);color:var(--ink);
  font:400 15px/1.6 Inter,ui-sans-serif,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.disp{font-family:Archivo,ui-sans-serif,system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
a{color:inherit;text-decoration:none}

main{max-width:1400px;margin:0 auto;padding:0 24px 90px}

/* ---- hero: statement + one pill ---- */
.hero{text-align:center;padding:84px 0 56px}
h1{font-family:Archivo;font-size:clamp(36px,5.4vw,64px);font-weight:800;
  letter-spacing:-.025em;line-height:1.04;margin:0;color:var(--ink)}
.pillbtn{display:inline-block;margin-top:30px;padding:13px 34px;border-radius:999px;
  font:700 14.5px Archivo,sans-serif;color:var(--accent-ink);background:var(--grad);
  transition:filter .2s,transform .2s}
.pillbtn:hover{filter:brightness(1.1);transform:translateY(-1px)}

/* ---- featured: wide banner tiles, name inside ---- */
.feature{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}
.feature .wide3{grid-template-columns:1fr 1fr 1fr}
.ban{position:relative;display:block;border:1px solid var(--line);border-radius:4px;
  overflow:hidden;background:var(--panel);aspect-ratio:41/14;
  transition:border-color .2s}
.ban:hover{border-color:var(--faint)}
.ban canvas{position:absolute;inset:0;width:100%;height:100%;display:block;
  image-rendering:pixelated}
/* bottom scrim so the name survives light banners — text-shadow alone dies on
   a pale background (Moonettes proved it immediately) */
.ban::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;
  background:linear-gradient(transparent,rgba(0,0,0,.62));pointer-events:none}
.ban .nm{z-index:1}
.ban .nm{position:absolute;left:0;right:0;bottom:14px;display:flex;gap:8px;
  align-items:center;justify-content:center;
  font:700 16px Archivo,sans-serif;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 18px rgba(0,0,0,.7)}
.ban .nm i{width:14px;height:14px;flex:none;border-radius:3px;background:var(--grad)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:20px}
@media (max-width:900px){.feature,.row3{grid-template-columns:1fr}}

/* ---- section rows ---- */
.sechead{display:flex;align-items:center;justify-content:space-between;
  gap:20px;margin:64px 0 20px}
.sechead h2{font-family:Archivo;font-size:24px;font-weight:800;letter-spacing:-.015em;
  margin:0;background:var(--grad);-webkit-background-clip:text;background-clip:text;
  color:transparent}
.sechead a{font:600 13px Archivo,sans-serif;padding:8px 18px;border-radius:999px;
  border:1px solid var(--line2);color:var(--ink);transition:background .2s}
.sechead a:hover{background:var(--panel2)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;
  overflow:hidden;display:block;transition:border-color .2s}
.card:hover{border-color:var(--faint)}
.card .thumb{aspect-ratio:1;background:var(--bg);display:block}
.card .thumb canvas{width:100%;height:100%;display:block;image-rendering:pixelated;
  transition:opacity .3s ease}
.card .thumb canvas.swap{opacity:.15}
.card .meta{padding:11px 13px 13px}
.card .meta b{display:block;font-family:Archivo;font-size:14px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta span{display:block;margin-top:2px;font-size:12px;color:var(--faint)}
.card.hide{display:none}

.card .tok{aspect-ratio:1;display:grid;place-items:center;position:relative;background:var(--bg)}
.card .tok b{font-family:Archivo;font-size:24px;font-weight:800;color:var(--dim)}
.none{border:1px dashed var(--line2);border-radius:4px;padding:40px 24px;text-align:center}
.none p{margin:0 0 4px;font-family:Archivo;font-size:15px;font-weight:700}
.none span{color:var(--faint);font-size:13px}

footer{border-top:1px solid var(--line);margin-top:90px;padding:26px 0 60px;
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-size:12.5px;color:var(--faint)}
</style>
</head>
<body>

<main>
  <header class="hero">
    <h1 class="disp">Draw thirty traits.<br>Ship ten thousand.</h1>
    <a class="pillbtn" href="/app">Start drawing</a>
  </header>

  <!-- featured banners: 2 wide, then 3 -->
  <section aria-label="Featured">
    <div class="feature" id="feat2"></div>
    <div class="row3" id="feat3"></div>
  </section>

  <section aria-label="Collections">
    <div class="sechead"><h2 class="disp">Hot Collections</h2><a href="/app">View all</a></div>
    <div class="cards" id="cards"></div>
  </section>

  <section aria-label="Tokens">
    <div class="sechead"><h2 class="disp">Hot Tokens</h2><a href="/app">Launch one</a></div>
    <div class="cards" id="tokens"></div>
  </section>

  <footer>
    <span>Built on Metaplex Core and Meteora. We take no cut of your mint.</span>
    <span><a href="/app">Editor</a></span>
  </footer>
</main>

<script src="/brand.js"></script>
<script src="/ui.js"></script>
<script src="/wallet.js"></script>
<script src="/shell.js"></script>
<script>
(function () {
  "use strict";
  var esc = UI.esc, shortAddr = UI.shortAddr;
  Shell.mount({ active: "collections", search: true });

  /* ---------------- template loading + compositing ---------------- */

  function loadTemplate(file) {
    return fetch("/templates/" + file).then(function (r) { return r.json(); })
      .then(function (doc) {
        return Promise.all(doc.project.categories.map(function (c) {
          return Promise.all(c.traits.map(function (t) {
            return new Promise(function (res) {
              var im = new Image();
              im.onload = function () { res({ img: im, w: t.weight || 1 }); };
              im.onerror = function () { res(null); };
              im.src = t.image;
            });
          })).then(function (l) { return l.filter(Boolean); });
        })).then(function (loaded) {
          return { cats: loaded.filter(function (c) { return c.length; }),
                   cell: (doc.project.canvas && doc.project.canvas.pixel) || 24 };
        });
      });
  }
  function pickFrom(list) {
    var total = 0, i;
    for (i = 0; i < list.length; i++) total += list[i].w;
    var r = Math.random() * total;
    for (i = 0; i < list.length; i++) { r -= list[i].w; if (r <= 0) return list[i].img; }
    return list[list.length - 1].img;
  }
  function paint(cv, t) {
    cv.width = cv.height = t.cell;
    var g = cv.getContext("2d");
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, t.cell, t.cell);
    for (var i = 0; i < t.cats.length; i++) g.drawImage(pickFrom(t.cats[i]), 0, 0, t.cell, t.cell);
  }

  /* A wide banner from a template, the way a team would make one by hand: the
   * background trait stretched across the tile, and a line-up of generated
   * characters (everything except the background category) standing on it.
   * First category = background is the templates' own convention: index 0 is
   * the furthest-back layer by definition of the editor. */
  function paintBanner(cv, t, chars) {
    var W = 615, HH = 210;
    cv.width = W; cv.height = HH;
    var g = cv.getContext("2d");
    g.imageSmoothingEnabled = false;
    var bg = pickFrom(t.cats[0]);
    // cover: scale the square background to fill the width, crop vertically
    g.drawImage(bg, 0, 0, bg.width, bg.height * (HH / W), 0, 0, W, HH);

    var n = chars || 5;
    var size = Math.floor(HH * 0.72 / t.cell) * t.cell || t.cell;  // integer scale, crisp
    var scale = Math.max(1, Math.floor((HH * 0.72) / t.cell));
    size = t.cell * scale;
    var gap = (W - n * size) / (n + 1);
    var off = document.createElement("canvas");
    off.width = off.height = t.cell;
    var og = off.getContext("2d");
    og.imageSmoothingEnabled = false;
    for (var i = 0; i < n; i++) {
      og.clearRect(0, 0, t.cell, t.cell);
      for (var c = 1; c < t.cats.length; c++) og.drawImage(pickFrom(t.cats[c]), 0, 0, t.cell, t.cell);
      g.drawImage(off, Math.round(gap + i * (size + gap)), HH - size - 8, size, size);
    }
  }

  /* ---------------- data + render ---------------- */

  function getJson(url, key) {
    return fetch(url).then(function (r) { return r.json(); })
      .then(function (j) { return (j && j[key]) || []; })
      .catch(function () { return []; });
  }

  Promise.all([
    getJson("/api/collections", "collections"),
    getJson("/api/tokens", "tokens"),
    getJson("/templates/index.json", "templates")
  ]).then(function (r) { draw(r[0], r[1], r[2]); });

  function bannerTile(name, href) {
    return '<a class="ban" data-name="' + esc(name) + '" href="' + esc(href) + '">' +
      '<canvas></canvas><span class="nm"><i></i>' + esc(name) + "</span></a>";
  }
  function squareCard(x, href, sub) {
    return '<a class="card" data-name="' + esc(x.name) + '" href="' + esc(href) + '">' +
      '<div class="thumb"><canvas></canvas></div>' +
      '<div class="meta"><b>' + esc(x.name) + "</b><span>" + esc(sub) + "</span></div></a>";
  }

  var rerolls = [];
  setInterval(function () {
    var live = rerolls.filter(function (r) {
      return r.cv.isConnected && !r.cv.closest(".card").classList.contains("hide");
    });
    if (!live.length) return;
    var p = live[(Math.random() * live.length) | 0];
    p.cv.classList.add("swap");
    setTimeout(function () {
      if (p.cv.isConnected) { paint(p.cv, p.tp); p.cv.classList.remove("swap"); }
    }, 300);
  }, 1400);

  function draw(collections, tokens, templates) {
    var live = collections && collections.length;
    var feat = (live ? collections : templates).slice(0, 5);
    var rest = (live ? collections : templates).slice(5);

    // featured banners: 2 + 3, art compos­ited per tile
    var f2 = document.getElementById("feat2"), f3 = document.getElementById("feat3");
    f2.innerHTML = feat.slice(0, 2).map(function (x) {
      return bannerTile(x.name, live ? "/mint/" + x.candyMachine : "/app");
    }).join("");
    f3.innerHTML = feat.slice(2, 5).map(function (x) {
      return bannerTile(x.name, live ? "/mint/" + x.candyMachine : "/app");
    }).join("");
    feat.forEach(function (x, i) {
      var host = i < 2 ? f2.children[i] : f3.children[i - 2];
      var cv = host && host.querySelector("canvas");
      if (!cv || live) return;                      // live banners need real art; later
      loadTemplate(x.file).then(function (tp) {
        paintBanner(cv, tp, i < 2 ? 5 : 3);
      }).catch(function () {});
    });

    // hot collections: the remaining templates as square cards, rerolling
    var cards = document.getElementById("cards");
    cards.innerHTML = rest.map(function (x) {
      return squareCard(x, live ? "/mint/" + x.candyMachine : "/app",
        live ? shortAddr(x.candyMachine) : x.traits + " traits · " + x.categories + " categories");
    }).join("");
    rest.forEach(function (x, i) {
      var cv = cards.children[i] && cards.children[i].querySelector("canvas");
      if (!cv || live) return;
      loadTemplate(x.file).then(function (tp) {
        paint(cv, tp);
        rerolls.push({ cv: cv, tp: tp });
      }).catch(function () {});
    });

    // tokens
    var tok = document.getElementById("tokens");
    if (tokens.length) {
      tok.innerHTML = tokens.map(function (t) {
        return '<a class="card" data-name="' + esc(t.name + " " + t.symbol) +
          '" href="https://jup.ag/swap/SOL-' + esc(t.mint) + '" target="_blank" rel="noopener">' +
          '<div class="tok"><b>$' + esc(t.symbol || "?") + '</b></div>' +
          '<div class="meta"><b>' + esc(t.name) + '</b><span class="mono">' +
          esc(shortAddr(t.mint)) + "</span></div></a>";
      }).join("");
    } else {
      tok.innerHTML = '<div class="none" style="grid-column:1/-1">' +
        "<p class='disp'>No tokens launched yet</p>" +
        "<span>The first one gets this whole row to itself.</span></div>";
    }
  }

  /* search filters every named tile, banners included */
  document.addEventListener("shell:search", function (e) {
    var q = (e.detail.query || "").trim().toLowerCase();
    document.querySelectorAll("[data-name]").forEach(function (c) {
      var hit = !q || (c.dataset.name || "").toLowerCase().indexOf(q) >= 0;
      c.classList.toggle("hide", !hit);
      if (c.classList.contains("ban")) c.style.display = hit ? "" : "none";
    });
  });
})();
</script>
</body>
</html>

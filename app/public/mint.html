<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAVES Launchpad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
/* The mint page, after the reference Kyle likes: a full-width banner hero
 * with the collection's identity on it, the sale panel floating on the right
 * with the phase ladder, and the minted pieces in a grid below. Identity
 * comes from the _collection.json / _banner.png pinned at launch; numbers
 * come from the machine; phases from the guard. Nothing is editorial. */
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;min-height:100%}
body{background:var(--void);color:var(--ink);
  font:400 15px/1.6 Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.disp{font-family:Archivo,ui-sans-serif,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
a{color:inherit;text-decoration:none}

/* ---- hero: banner behind, identity left, sale panel right ---- */
.hero{position:relative;border-bottom:1px solid var(--line);overflow:hidden}
.hero .bg{position:absolute;inset:0;background:var(--panel);overflow:hidden}
.hero .bg img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;
  display:block;filter:brightness(.55)}
.hero .bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.45) 45%,rgba(0,0,0,.6) 100%)}
.hero-in{position:relative;max-width:1400px;margin:0 auto;padding:40px 24px;
  display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:36px;align-items:start}
@media (max-width:960px){.hero-in{grid-template-columns:1fr}}

.who{display:flex;flex-direction:column;gap:14px;min-width:0}
.who .ava{width:84px;height:84px;border-radius:12px;background:var(--raise);
  border:1px solid rgba(255,255,255,.22);overflow:hidden;display:grid;place-items:center;
  color:var(--faint);font:800 26px Archivo}
.who .ava img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}
.who h1{font-family:Archivo;font-size:clamp(28px,3.6vw,44px);font-weight:800;
  letter-spacing:-.02em;margin:0;background:var(--grad);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.who .by{font-size:13px;color:var(--dim)}
.who .by .mono{color:var(--faint)}
.who .desc{margin:0;color:var(--dim);font-size:14px;max-width:56ch;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border:1px solid rgba(255,255,255,.22);border-radius:99px;
  font:500 12px Inter,sans-serif;color:var(--dim);background:rgba(0,0,0,.4);
  transition:color .2s,border-color .2s}
.links a:hover{color:var(--ink);border-color:var(--faint)}
.links a i{font-style:normal;color:var(--faint);font-size:10px}
/* socials are marks, not words — one round button per platform */
.links a.ic{width:34px;height:34px;padding:0;justify-content:center;border-radius:99px}
.links a.ic svg{width:15px;height:15px;display:block;fill:currentColor}
.links a.ic img{width:16px;height:16px;display:block;border-radius:3px}
/* the share mark is drawn with strokes, not fills */
.links a#share svg{fill:none;stroke:currentColor;stroke-width:2}

/* ---- sale panel ---- */
.sale{background:rgba(10,10,10,.88);backdrop-filter:blur(14px);
  border:1px solid transparent;border-radius:14px;padding:20px;
  background:linear-gradient(rgba(12,12,12,.92),rgba(12,12,12,.92)) padding-box,
             var(--grad) border-box}
.sale .tt{display:flex;justify-content:space-between;align-items:baseline;
  font-size:13px;color:var(--dim)}
.sale .tt b{font:600 13px "IBM Plex Mono",monospace;color:var(--ink)}
.bar{height:7px;border-radius:99px;background:var(--raise);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;transition:width .4s ease;
  background-image:var(--grad);background-repeat:no-repeat;
  background-size:calc(100% + 2px) 100%;background-position:-1px 0}
.pctline{display:flex;justify-content:space-between;font:400 11px "IBM Plex Mono",monospace;
  color:var(--faint);margin-bottom:8px}

.ph{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:8px;
  border:1px solid var(--line);border-radius:10px;font-size:12.5px;color:var(--dim);
  background:rgba(255,255,255,.02)}
.ph b{font:600 11.5px "IBM Plex Mono",monospace;letter-spacing:.06em;flex:none}
.ph .st{margin-left:auto;flex:none;font:500 10.5px "IBM Plex Mono",monospace;color:var(--faint)}
.ph.open .st{color:var(--accent)}
.ph.mine{border-color:rgba(var(--accent-rgb),.5)}
.ph.mine b{color:var(--accent)}

/* quantity stepper: minus, the number, plus, and MAX */
.qty{display:flex;align-items:center;gap:8px;margin-top:14px}
.qty button{width:42px;height:42px;flex:none;border-radius:10px;cursor:pointer;
  border:1px solid var(--line2);background:var(--panel2);color:var(--ink);
  font:700 19px Archivo,sans-serif;line-height:1;transition:border-color .18s,color .18s}
.qty button:hover:not(:disabled){border-color:var(--faint)}
.qty button:disabled{opacity:.35;cursor:default}
.qty .n{flex:1;text-align:center;font:700 20px "IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:10px;
  background:var(--void);padding:9px 0;color:var(--ink)}
.qty .max{width:auto;padding:0 14px;font:700 12px Archivo,sans-serif;letter-spacing:.06em}
.qtynote{margin:7px 0 0;font:400 11px "IBM Plex Mono",monospace;color:var(--faint);
  display:flex;justify-content:space-between;gap:10px}
.btn{display:block;width:100%;margin-top:16px;padding:15px;border-radius:999px;border:1px solid transparent;
  font:700 15px Archivo,sans-serif;cursor:pointer;color:var(--accent-ink);
  background-image:var(--grad);background-repeat:no-repeat;
  background-size:calc(100% + 2px) 100%;background-position:-1px 0}
.btn:disabled{opacity:.4;cursor:default}
.msg{margin-top:12px;font-size:12.5px;padding:11px 12px;border-radius:8px;display:none}
.msg.err{display:block;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.35);color:#ffb3b3}
.msg.ok{display:block;background:rgba(var(--accent-rgb),.08);border:1px solid rgba(var(--accent-rgb),.3);color:#8ff5cd}
.msg a{color:inherit}
.sale .foot{text-align:center;margin-top:12px;font-size:11px;color:var(--faint)}
/* the paired token, when this collection launched with one */
.pairlink{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 13px;
  border:1px solid transparent;border-radius:10px;
  background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box;
  transition:filter .2s}
.pairlink:hover{filter:brightness(1.15)}
.pairlink .c{width:30px;height:30px;flex:none;border-radius:7px;overflow:hidden;
  background:var(--panel2);display:grid;place-items:center;font:800 13px Archivo}
.pairlink .c img{width:100%;height:100%;object-fit:cover;display:block}
.pairlink b{font:700 13px Archivo;display:block}
.pairlink span{display:block;font-size:11px;color:var(--faint)}
.pairlink .arw{margin-left:auto;flex:none;font:700 16px Archivo;color:var(--accent)}
.pairlink>span:nth-child(2){min-width:0;flex:1}
.pairlink b,.pairlink span.s,.pairlink span:nth-child(2)>span{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- below: the pieces ---- */
main{max-width:1400px;margin:0 auto;padding:34px 24px 90px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tab{font-family:Archivo;font-size:18px;font-weight:800;letter-spacing:-.01em;
  padding:0 2px 12px;border:0;background:transparent;cursor:pointer;color:var(--faint);
  border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:transparent;background:var(--grad);
  -webkit-background-clip:text;background-clip:text;border-bottom-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px}
.piece{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  overflow:hidden;transition:border-color .2s}
.piece:hover{border-color:var(--faint)}
.piece img{width:100%;aspect-ratio:1;object-fit:cover;image-rendering:pixelated;display:block;
  background:var(--bg)}
.piece .nm{padding:10px 12px;font:700 13px Archivo}
.none{border:1px dashed var(--line2);border-radius:8px;padding:40px 24px;text-align:center;
  color:var(--faint);font-size:13px}
</style>
</head>
<body>

<header class="hero">
  <div class="bg"><img id="banner" alt="" hidden></div>
  <div class="hero-in">
    <div class="who">
      <div class="ava" id="ava">?</div>
      <h1 class="disp" id="name">Loading…</h1>
      <div class="by">created by <span class="mono" id="creator">—</span></div>
      <p class="desc" id="desc" hidden></p>
      <div class="links" id="links"></div>
    </div>

    <div class="sale">
      <div class="tt"><span>Total</span><b id="minted">—</b></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="pctline"><span id="pct">—</span><span class="mono" id="addr">—</span></div>
      <div id="phases"></div>
      <div class="qty" id="qty" hidden>
        <button id="q-minus" type="button" aria-label="One fewer">−</button>
        <div class="n" id="q-n">1</div>
        <button id="q-plus" type="button" aria-label="One more">+</button>
        <button id="q-max" class="max" type="button">MAX</button>
      </div>
      <p class="qtynote" id="q-note" hidden><span id="q-limit"></span><span id="q-cost"></span></p>
      <button class="btn" id="go" disabled>Loading…</button>
      <div class="msg" id="msg"></div>
      <a class="pairlink" id="pairlink" hidden></a>
      <a class="pairlink" id="stakelink" hidden></a>
    </div>
  </div>
</header>

<main>
  <div class="tabs" role="tablist">
    <button class="tab" id="t-minted" role="tab" aria-selected="true">Minted</button>
    <button class="tab" id="t-all" role="tab" aria-selected="false">Full collection</button>
  </div>
  <div class="grid" id="pieces"></div>
  <div class="none" id="pieces-none" hidden>The art appears here as pieces mint.</div>
</main>

<script src="/brand.js"></script>
<script src="/ui.js"></script>
<script src="/wallet.js"></script>
<script src="/shell.js"></script>
<script>Shell.mount({ search: false });</script>
<script>
/* One mint page, two chains. A 0x address is a Robinhood Chain drop and gets
 * the EVM driver; a base58 address is a candy machine and runs the Solana
 * path below untouched. */
(function () {
  var m = location.pathname.match(/\/mint\/(0x[0-9a-fA-F]{40})/);
  var q = new URLSearchParams(location.search).get("cm");
  window.__EVM_MINT = (m && m[1]) ||
    (q && /^0x[0-9a-fA-F]{40}$/.test(q) ? q : null);
  if (!window.__EVM_MINT) return;
  ["/evm-chains.js", "/evm-contract.js",
   "/evm-collections.js", "/evm-mint.js"].reduce(function (p, src) {
    return p.then(function () {
      return new Promise(function (res, rej) {
        var el = document.createElement("script");
        el.src = src; el.onload = res;
        el.onerror = function () { rej(new Error("failed to load " + src)); };
        document.head.appendChild(el);
      });
    });
  }, Promise.resolve()).then(function () {
    window.EvmMintPage.init(window.__EVM_MINT);
  });
})();
</script>
<script src="/launch.js"></script>
<script src="/share-widget.js"></script>
<script>
(function () {
  "use strict";
  if (window.__EVM_MINT) return;   // the EVM driver owns the page
  var esc = UI.esc, shortAddr = UI.shortAddr;
  var $ = function (id) { return document.getElementById(id); };

  // /mint/<address> in production, ?cm=<address> when opened as a file or on
  // the dev server, which has no rewrite rules.
  function machineAddress() {
    var m = location.pathname.match(/\/mint\/([1-9A-HJ-NP-Za-km-z]{32,44})/);
    if (m) return m[1];
    return new URLSearchParams(location.search).get("cm") || "";
  }

  var CM = machineAddress();
  var qcl = new URLSearchParams(location.search).get("cluster");
  if (qcl) window.Launch.cluster(qcl);
  var state = null;
  var lists = null;                                // _allowlist.json phases, by label
  var myPhase = null;                              // {group, wallets} for mintOne
  var metaDir = null;                              // arweave dir the metadata lives in
  var nameSet = false;                             // real name in place — don't flash "Mint"
  var tab = "minted";

  function say(kind, html) {
    var m = $("msg");
    m.className = "msg " + kind;
    m.innerHTML = html;
  }

  /* The row under the name: where this collection lives on chain, then
   * wherever its creator lives. The explorer links are always available
   * because they come from addresses the page already holds; socials come
   * from the _links.json pinned at launch, so they are the creator's. */
  var MARK = {
    website: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 9h-3a15.6 15.6 0 0 0-1.1-5.2A8 8 0 0 1 18.9 11ZM12 4.1c.7 1 1.6 3 1.8 6.9h-3.6c.2-3.9 1.1-5.9 1.8-6.9ZM5.1 11a8 8 0 0 1 4.1-5.2A15.6 15.6 0 0 0 8.1 11Zm0 2h3a15.6 15.6 0 0 0 1.1 5.2A8 8 0 0 1 5.1 13Zm6.9 6.9c-.7-1-1.6-3-1.8-6.9h3.6c-.2 3.9-1.1 5.9-1.8 6.9Zm2.8-1.7a15.6 15.6 0 0 0 1.1-5.2h3a8 8 0 0 1-4.1 5.2Z"/></svg>',
    x: '<svg viewBox="0 0 24 24"><path d="M18.9 2H22l-7 8 8.2 12h-6.4l-5-7.3L5.6 22H2.5l7.5-8.6L2 2h6.6l4.6 6.7Zm-1.1 18h1.7L7.3 3.8H5.5Z"/></svg>',
    telegram: '<svg viewBox="0 0 24 24"><path d="M21.9 4.3 18.9 19c-.2 1-.8 1.3-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.5-1 .5l.3-4.7L18.3 6c.4-.3-.1-.5-.6-.2L6.9 12.7l-4.6-1.4c-1-.3-1-1 .2-1.5l18-6.9c.8-.3 1.6.2 1.4 1.4Z"/></svg>',
    discord: '<svg viewBox="0 0 24 24"><path d="M19.3 5.3A16.8 16.8 0 0 0 15.1 4l-.2.4a12.7 12.7 0 0 1 3.7 1.9 13.4 13.4 0 0 0-11.2 0A12.7 12.7 0 0 1 11 4.4L10.9 4a16.8 16.8 0 0 0-4.2 1.3C3.9 9.4 3.2 13.4 3.5 17.4a16.9 16.9 0 0 0 5.1 2.6l.7-1.2a11 11 0 0 1-1.7-.8l.4-.3a12.1 12.1 0 0 0 10 0l.4.3a11 11 0 0 1-1.7.8l.7 1.2a16.9 16.9 0 0 0 5.1-2.6c.4-4.6-.7-8.6-3.2-12.1ZM9.7 15.1c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm4.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/></svg>'
  };
  function explorer(addr) {
    return "https://explorer.solana.com/address/" + addr +
      (window.Launch.cluster() === "devnet" ? "?cluster=devnet" : "");
  }
  function renderLinks(links) {
    // No explorer pills — the machine address sits under the mint progress
    // bar already, and the row is for the project's own places.
    var out = [];
    /* Tensor, not OpenSea: OpenSea has no address-based route for a Solana
     * collection — it needs a slug it assigns after indexing, and both
     * opensea.io/assets/solana/<addr> and /collection/<addr> answer 404.
     * Tensor takes the collection address directly. Mainnet only, because a
     * devnet collection does not exist on any marketplace. */
    if (state && state.collection && window.Launch.cluster() === "mainnet-beta") {
      out.push('<a class="ic" href="https://www.tensor.trade/trade/' + esc(state.collection) +
        '" target="_blank" rel="noopener" title="Tensor" aria-label="Tensor">' +
        '<img src="/art/tensor.png" alt="" width="16" height="16"></a>');
    }
    // Share is a mark, like the socials
    out.push('<a class="ic" id="share" href="#" title="Share" aria-label="Share">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 13.4l7.4 4.3M15.7 6.3l-7.4 4.3"/></svg>' + "</a>");
    [["website", "Website"], ["x", "X"], ["telegram", "Telegram"], ["discord", "Discord"]]
      .forEach(function (kv) {
        var v = links && links[kv[0]];
        if (!v) return;
        var href = /^https?:/.test(v) ? v
          : kv[0] === "x" ? "https://x.com/" + String(v).replace(/^@/, "")
          : "https://" + v;
        out.push('<a class="ic" title="' + kv[1] + '" aria-label="' + kv[1] +
          '" href="' + esc(href) + '" target="_blank" rel="noopener">' + MARK[kv[0]] + "</a>");
      });
    $("links").innerHTML = out.join("");
    var sb = $("share");
    if (sb) sb.onclick = function (e) {
      e.preventDefault();
      window.WavesShare.open({
        id: CM, to: "mint",
        name: ($("name").textContent || "This collection"),
        title: "collection"
      });
    };
  }

  /* Read art through the mirror — /api/mirror serves our short-lived copy of a
   * fresh upload and redirects to Arweave otherwise, so a just-launched banner
   * and pfp show instantly instead of waiting minutes for arweave.net to seed
   * them. The same helper the token page uses. */
  function art(u) {
    return u && /^https:\/\/arweave\.net\//.test(u)
      ? "/api/mirror?u=" + encodeURIComponent(u) : u;
  }

  /* Load an image through the mirror, retrying quietly if the gateway 404s a
   * fresh upload rather than flashing a broken tile. Idempotent per slot, so
   * the record (fast) and the _collection.json fallback (slow) can both call it
   * and whichever arrives first wins. */
  var artSet = { pfp: false, banner: false };
  function loadArt(slot, url, apply) {
    if (artSet[slot] || !url) return;
    artSet[slot] = true;
    var src = art(url), im = new Image();
    im.alt = "";
    im.onload = function () { apply(im); };
    im.onerror = function () {
      var tries = 0;
      var retry = setInterval(function () {
        if (++tries > 10) return clearInterval(retry);   // ~5 minutes
        im.src = src + (src.indexOf("?") < 0 ? "?" : "&") + "r=" + tries;
      }, 30000);
    };
    im.src = src;
  }
  function setPfp(url) {
    loadArt("pfp", url, function (im) { var a = $("ava"); a.innerHTML = ""; a.appendChild(im); });
  }
  function setBanner(url) {
    loadArt("banner", url, function (im) { $("banner").src = im.src; $("banner").hidden = false; });
  }

  /* ---- identity, from the files pinned at launch ----
   * The record (loadPairedToken) sets the pfp and banner first, straight from
   * KV with no gateway round-trip. This is the fallback for the name and
   * description, and for older collections the record predates — but it still
   * routes its images through the mirror, and setPfp/setBanner are idempotent,
   * so it never overrides the faster record path. */
  function loadIdentity() {
    if (!metaDir) return;
    fetch(metaDir + "_collection.json").then(function (r) { return r.ok ? r.json() : null; })
      .then(function (col) {
        if (!col) return;
        if (col.name) { $("name").textContent = col.name; nameSet = true; }
        if (col.description) { $("desc").textContent = col.description; $("desc").hidden = false; }
        setPfp(col.image);
        setBanner(col.banner);
      }).catch(function () {});
    fetch(metaDir + "_links.json").then(function (r) { return r.ok ? r.json() : null; })
      .then(function (links) { renderLinks(links); })
      .catch(function () { renderLinks(null); });
  }

  /* The pinned wallet lists behind the merkle roots. Public by design —
   * an allowlist you cannot audit is not an allowlist. */
  function loadLists() {
    if (!metaDir) return Promise.resolve(null);
    // A just-launched collection can 404 on Arweave for a few seconds while the
    // gateway indexes the bundle. Retry a handful of times before giving up, so
    // a mint page opened right after launch still finds the waves.
    var url = metaDir + "_allowlist.json";
    return (function attempt(n) {
      return fetch(url).then(function (r) {
        if (r.ok) return r.json();
        if (r.status === 404 && n > 0) {
          return new Promise(function (res) { setTimeout(res, 1500); }).then(function () { return attempt(n - 1); });
        }
        return null;
      }).catch(function () {
        return n > 0 ? new Promise(function (res) { setTimeout(res, 1500); }).then(function () { return attempt(n - 1); }) : null;
      });
    })(4);
  }

  var gateQual = {};                               // label -> {ok, gateNft} for collection/token waves

  /* Which phase can THIS wallet mint through right now?
   * The earliest-opened wave the wallet qualifies for wins (waves stay open once
   * started); the public group works for anyone once it opens. Wallet waves check
   * list membership; collection/token waves use holdership resolved by
   * checkGates() — the guard enforces it on-chain either way. */
  function resolvePhase() {
    myPhase = null;
    var w = window.Wallet.current();
    var now = Date.now();
    for (var i = 0; i < state.groups.length; i++) {
      var g = state.groups[i];
      if (g.opensAt && g.opensAt > now) continue;
      var ph = lists && (lists.phases || []).find(function (p) { return p.label === g.label; });
      if (!ph) {
        // no pinned phase → a public/open group; an allowList group with no list
        // can't be proven, so skip it
        if (!g.allowlisted) { myPhase = { group: g.label }; break; }
        continue;
      }
      var kind = ph.kind || (ph.wallets ? "wallets" : null);
      if (kind === "wallets") {
        if (w && ph.wallets && ph.wallets.indexOf(w.publicKey) >= 0) { myPhase = { group: g.label, wallets: ph.wallets }; break; }
      } else if (kind === "coin") {
        if (gateQual[g.label] && gateQual[g.label].ok) { myPhase = { group: g.label }; break; }
      } else if (kind === "nft") {
        var q = gateQual[g.label];
        if (q && q.ok) { myPhase = { group: g.label, gateNft: q.gateNft }; break; }
      }
    }
  }

  /* Resolve collection/token holdership once per wallet, then re-pick + re-paint.
   * Fire-and-forget from the wallet/list hooks; the on-chain guard is the real
   * check, this only decides which wave the page offers you. */
  async function checkGates() {
    var w = window.Wallet.current();
    if (!w || !lists) return;
    var phs = lists.phases || [];
    for (var i = 0; i < phs.length; i++) {
      var ph = phs[i];
      if (ph.kind !== "coin" && ph.kind !== "nft") continue;
      if (gateQual[ph.label]) continue;            // cached for this wallet
      try {
        if (ph.kind === "coin") {
          gateQual[ph.label] = { ok: await window.Launch.holdsToken(w.publicKey, ph.address, ph.min) };
        } else {
          var nft = await window.Launch.heldFromCollection(w.publicKey, ph.address, Number(ph.min || 1));
          gateQual[ph.label] = { ok: !!nft, gateNft: nft };
        }
      } catch (e) { gateQual[ph.label] = { ok: false }; }
    }
    resolvePhase(); renderPhases();
  }

  function phaseName(label) {
    var ph = lists && (lists.phases || []).find(function (p) { return p.label === label; });
    if (ph && ph.name) return ph.name;
    if (label === "pub") return "Public";
    var m = label.match(/^w(\d+)$/);
    return m ? "Wave " + m[1] : label;
  }

  function renderPhases() {
    var box = $("phases");
    var w = window.Wallet.current();
    var now = Date.now();
    if (!state.groups.length) {
      box.innerHTML = '<div class="ph open"><b>Public</b><span>everyone · ' +
        (state.priceSol == null ? "free" : state.priceSol + " SOL") +
        '</span><span class="st">' +
        (state.opensAt && state.opensAt > now
          ? "opens " + new Date(state.opensAt).toLocaleString() : "open") + "</span></div>";
      return;
    }
    box.innerHTML = state.groups.map(function (g) {
      var open = !g.opensAt || g.opensAt <= now;
      var mine = myPhase && myPhase.group === g.label;
      // The gate that decides who mints comes from the pinned phase (its kind),
      // NOT from g.allowlisted — that flag is only set for the wallet-merkle
      // guard, so a token/collection wave would otherwise read as "everyone".
      var ph = lists && (lists.phases || []).find(function (p) { return p.label === g.label; });
      var who;
      if (!ph) {
        who = "everyone";
      } else if (ph.kind === "wallets") {
        var onList = w ? (ph.wallets || []).indexOf(w.publicKey) >= 0 : null;
        who = onList === null ? "wallet allowlist"
          : onList ? "you're on this list" : "not on this list";
      } else if (ph.kind === "coin") {
        var qc = gateQual[g.label];
        who = "token holders" + (qc ? (qc.ok ? " · you qualify" : " · you don't hold enough") : "");
      } else if (ph.kind === "nft") {
        var qn = gateQual[g.label];
        who = "collection holders" + (qn ? (qn.ok ? " · you qualify" : " · you don't hold it") : "");
      } else {
        who = "allowlist";
      }
      var status = open ? "open" : "opens " + new Date(g.opensAt).toLocaleTimeString(
        [], { hour: "numeric", minute: "2-digit" });
      return '<div class="ph' + (open ? " open" : "") + (mine ? " mine" : "") + '">' +
        "<b>" + phaseName(g.label) + "</b><span>" + who +
        (g.priceSol != null ? " · " + (g.priceSol === 0 ? "free" : g.priceSol + " SOL") : "") +
        '</span><span class="st">' + status + "</span></div>";
    }).join("");
  }

  /* ---- the pieces below ---- */
  var pieceCache = {};
  function renderPieces() {
    var grid = $("pieces"), none = $("pieces-none");
    var count = tab === "minted" ? state.redeemed : state.loaded;
    if (!metaDir || !count) {
      grid.innerHTML = ""; none.hidden = false;
      none.textContent = tab === "minted"
        ? "The art appears here as pieces mint."
        : "The collection's art could not be loaded.";
      return;
    }
    none.hidden = true;
    var show = Math.min(count, 48);
    grid.innerHTML = "";
    for (var i = 1; i <= show; i++) (function (id) {
      var cell = document.createElement("div");
      cell.className = "piece";
      cell.innerHTML = '<img alt="" loading="lazy"><div class="nm">#' + id + "</div>";
      grid.appendChild(cell);
      var done = function (meta) {
        if (!meta) return;
        if (meta.image) cell.querySelector("img").src = meta.image;
        if (meta.name) cell.querySelector(".nm").textContent = meta.name;
      };
      if (pieceCache[id]) return done(pieceCache[id]);
      fetch(metaDir + id + ".json").then(function (r) { return r.ok ? r.json() : null; })
        .then(function (meta) {
          if (meta && meta.image && !/^https?:/.test(meta.image)) {
            meta.image = metaDir.replace("/arweave.net/", "/arweave.net/") + meta.image;
          }
          pieceCache[id] = meta; done(meta);
        }).catch(function () {});
    })(i);
  }

  function setTab(t) {
    tab = t;
    $("t-minted").setAttribute("aria-selected", String(t === "minted"));
    $("t-all").setAttribute("aria-selected", String(t === "all"));
    renderPieces();
  }
  $("t-minted").onclick = function () { setTab("minted"); };
  $("t-all").onclick = function () { setTab("all"); };

  /* ---- load + arm ---- */
  async function load() {
    if (!CM) {
      $("name").textContent = "No collection";
      say("err", "This link is missing a candy machine address.");
      return;
    }
    $("addr").textContent = shortAddr(CM, 5);
    // identity from the record, fired before the chain read so the banner and
    // pfp are on their way while we wait — the record only needs CM, which we
    // already have
    loadPairedToken();
    try {
      state = await window.Launch.readMachine(CM);
    } catch (e) {
      $("name").textContent = "Not found";
      say("err", "Could not read that candy machine on " + window.Launch.cluster() + ". " +
                 "It may be on a different network.");
      return;
    }
    // Authoritative: the machine's own prefixUri (the metadata dir). Fall back
    // to stripping the filename off the first item's uri only if that is absent.
    var rawDir = null;
    if (state.prefixUri && /^https?:/.test(state.prefixUri)) {
      rawDir = state.prefixUri.replace(/[^/]*$/, "");   // keep it ending in "/"
    } else if (state.firstItemUri && /^https?:/.test(state.firstItemUri)) {
      rawDir = state.firstItemUri.replace(/[^/]+$/, "");
    }
    // Read through our /m/ proxy, not a raw arweave.net hop: a fresh bundle
    // 404s on arweave.net (and it caches that 404), while the proxy falls back
    // across gateways and resolves the bundle manifest by data-item id — the
    // difference between a mint page that finds its waves right after launch
    // and one that shows "everyone" until the gateway catches up.
    if (rawDir) {
      var mm = /arweave\.net\/([\w-]{43})\//.exec(rawDir);
      metaDir = mm ? location.origin + "/m/" + mm[1] + "/" : rawDir;
    }
    if (!nameSet) $("name").textContent = "Mint";
    $("creator").textContent = shortAddr(state.authority, 5);
    loadIdentity();

    if (state.groups.length) lists = await loadLists();
    resolvePhase();
    renderPhases();
    render();
    renderPieces();
    arm();
    checkGates();                                   // resolve collection/token waves, then re-pick
    // countdowns and phase openings resolve themselves without a reload
    setInterval(function () {
      resolvePhase(); renderPhases();
      if (!$("go").dataset.busy) arm();
    }, 30000);
  }

  function render() {
    var pct = state.available ? (state.redeemed / state.available) * 100 : 0;
    $("minted").textContent = state.redeemed.toLocaleString() + " / " + state.available.toLocaleString();
    $("bar").style.width = pct.toFixed(1) + "%";
    $("pct").textContent = pct.toFixed(1) + "% minted";
  }

  /* How many to mint. Each piece is its own transaction — the candy machine
   * mints one at a time — so a run of five is five signatures unless the
   * wallet batches them. Stopping early keeps whatever already minted, which
   * is why the cap is enforced here and re-read from the machine after. */
  var qty = 1;
  function mintCap() {
    var left = Math.max(0, (state ? state.available - state.redeemed : 0));
    var perWallet = (state && state.maxPerWallet) || 0;
    var cap = perWallet > 0 ? Math.min(left, perWallet) : left;
    return Math.max(1, Math.min(cap || 1, 50));   // 50 keeps a stray MAX sane
  }
  function priceEach() {
    if (myPhase) {
      var g = (state.groups || []).find(function (x) { return x.label === myPhase.group; });
      if (g && g.priceSol != null) return g.priceSol;
    }
    return state && state.priceSol != null ? state.priceSol : 0;
  }
  function renderQty() {
    var cap = mintCap();
    if (qty > cap) qty = cap;
    if (qty < 1) qty = 1;
    $("q-n").textContent = String(qty);
    $("q-minus").disabled = qty <= 1;
    $("q-plus").disabled = qty >= cap;
    $("q-max").disabled = qty >= cap;
    var each = priceEach();
    $("q-limit").textContent = (state && state.maxPerWallet)
      ? "max " + state.maxPerWallet + " per wallet" : cap + " left";
    $("q-cost").textContent = each > 0
      ? (Math.round(each * qty * 1e6) / 1e6) + " SOL" : "free";
  }
  function showQty(on) {
    $("qty").hidden = !on;
    $("q-note").hidden = !on;
    if (on) renderQty();
  }
  $("q-minus").onclick = function () { qty--; renderQty(); armLabel(); };
  $("q-plus").onclick = function () { qty++; renderQty(); armLabel(); };
  $("q-max").onclick = function () { qty = mintCap(); renderQty(); armLabel(); };
  function armLabel() {
    var go = $("go");
    if (go.dataset.busy || go.disabled) return;
    if (go.dataset.mode === "mint") {
      go.textContent = qty > 1 ? "Mint " + qty : "Mint";
      if (myPhase) go.textContent += " — " + phaseName(myPhase.group);
    }
  }

  function arm() {
    var w = window.Wallet.current();
    var go = $("go");
    delete go.dataset.mode;
    showQty(false);
    if (state.redeemed >= state.available) {
      go.disabled = true; go.textContent = "Sold out"; return;
    }
    if (!w) { go.disabled = false; go.textContent = "Connect wallet"; go.onclick = connect; return; }
    if (!state.groups.length) {
      var now = Date.now();
      if (state.opensAt && state.opensAt > now) {
        go.disabled = true; go.textContent = "Opens soon"; return;
      }
      go.disabled = false; go.dataset.mode = "mint"; go.onclick = mint;
      showQty(true); armLabel(); return;
    }
    if (myPhase) {
      go.disabled = false;
      go.dataset.mode = "mint";
      go.onclick = mint;
      showQty(true); armLabel();
      return;
    }
    var anyOpen = state.groups.some(function (g) { return !g.opensAt || g.opensAt <= Date.now(); });
    go.disabled = true;
    go.textContent = anyOpen ? "Not on an open allowlist yet" : "Opens soon";
  }

  /* A paired launch records the token against the collection. Show it here:
   * someone who found the mint should be one click from the token whose
   * trading fees pay this collection's holders. */
  function loadPairedToken() {
    fetch("/api/collections").then(function (r) { return r.json(); })
      .then(function (j) {
        var rec = (j.collections || []).find(function (c) { return c.candyMachine === CM; });
        if (!rec) return null;
        // identity straight from KV — no _collection.json gateway hop — served
        // through the mirror, so the banner and pfp are up before the chain read
        if (rec.name) { $("name").textContent = rec.name; nameSet = true; }
        setPfp(rec.avatar);
        setBanner(rec.banner);
        if (!rec.tokenMint) return null;
        return fetch("/api/tokens").then(function (r) { return r.json(); })
          .then(function (t) {
            var tok = (t.tokens || []).find(function (x) { return x.mint === rec.tokenMint; });
            return tok || { mint: rec.tokenMint, symbol: "", name: "Paired token" };
          });
      })
      .then(function (tok) {
        if (!tok) return;
        var el = $("pairlink");
        var sym = String(tok.symbol || "").toUpperCase();
        el.href = "/token/" + tok.mint;
        el.innerHTML =
          '<span class="c">' + (tok.icon
            ? '<img alt="" src="' + esc(tok.icon) + '">' : esc(sym.slice(0, 1) || "$")) + "</span>" +
          "<span><b>" + (sym ? "$" + esc(sym) : "Paired token") + "</b>" +
          "<span>" + esc(tok.name || "trades on a bonding curve") + "</span></span>" +
          '<span class="arw">→</span>';
        el.hidden = false;

        // and where holders of this collection stake to earn from those fees
        var st = $("stakelink");
        st.href = "/stake";
        st.innerHTML =
          '<span class="c">◈</span>' +
          "<span><b>Staking</b><span>burn to stake, earn from trading fees</span></span>" +
          '<span class="arw">→</span>';
        st.hidden = false;
      })
      .catch(function () {});
  }

  async function connect() {
    var w = await (window.Shell ? Shell.connect() : Promise.resolve(null));
    if (w) { gateQual = {}; resolvePhase(); renderPhases(); arm(); checkGates(); }
  }

  /* The wallet can arrive without anyone clicking Connect: the shell restores
   * an existing session on load, and that resolves a moment AFTER this page has
   * already drawn itself. Reading Wallet.current() once at startup meant the
   * page said "Connect wallet" to someone who was connected the whole time.
   * Redraw whenever the wallet changes — connect, disconnect, or the user
   * switching accounts in their extension. */
  if (window.Wallet) {
    window.Wallet.on("change", function () {
      gateQual = {};                               // holdership is per wallet
      resolvePhase(); renderPhases(); arm(); checkGates();
    });
  }

  async function mint() {
    var go = $("go");
    go.disabled = true;
    go.dataset.busy = "1";
    go.textContent = "Minting…";
    say("", "");
    var got = [];
    try {
      /* One transaction per piece — the candy machine mints singly — but one
       * approval for the whole run: mintMany builds the batch, has the wallet
       * sign it once, then broadcasts. Anything already minted is kept if a
       * later one fails; the count comes back off the machine either way. */
      got = await window.Launch.mintMany(CM, myPhase || {}, qty, function (p) {
        if (qty === 1) { go.textContent = "Minting…"; return; }
        if (p.phase === "build") go.textContent = "Preparing " + qty + "…";
        else if (p.phase === "sign") go.textContent = "Approve once for all " + qty + "…";
        else if (p.phase === "send") go.textContent = "Minting " + (p.done + 1) + " of " + qty + "…";
      });
      var url = "https://explorer.solana.com/address/" + got[got.length - 1] +
                (window.Launch.cluster() === "devnet" ? "?cluster=devnet" : "");
      say("ok", (got.length > 1 ? "Minted " + got.length + ". " : "Minted. ") +
        '<a href="' + url + '" target="_blank" rel="noopener">View it ↗</a>');
      state = await window.Launch.readMachine(CM);
      render(); renderPieces(); renderQty();
      delete go.dataset.busy;
      go.disabled = false;
      go.textContent = "Mint another";
    } catch (e) {
      // Guard failures arrive as program errors and read like nonsense to a
      // buyer, so the common ones are translated.
      var m = String(e.message || e);
      if (/0x1770|NotEnoughSOL|insufficient/i.test(m)) m = "Not enough SOL in your wallet.";
      else if (/0x1784|MintNotLive|StartDate/i.test(m)) m = "The mint has not opened yet.";
      else if (/CandyMachineEmpty|0x1785/i.test(m)) m = "Sold out.";
      else if (/User rejected|rejected the request/i.test(m)) m = "You cancelled the transaction.";
      if (got.length) {
        m = got.length + " minted before this stopped — those are yours. " + m;
        try { state = await window.Launch.readMachine(CM); render(); renderPieces(); renderQty(); }
        catch (e2) {}
      }
      say("err", m);
      delete go.dataset.busy;
      go.disabled = false;
      go.textContent = "Try again";
    }
  }

  load();
})();
</script>
</body>
</html>

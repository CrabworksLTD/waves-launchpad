<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chain check</title>
<link rel="stylesheet" href="/theme.css">
<style>
/* Diagnostics page. Deliberately plain — this exists to tell me whether the
   Solana layer works, not to look like anything. */
*{box-sizing:border-box}
body{margin:0;padding:28px;background:var(--bg);color:var(--ink);
  font:400 14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
h1{font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
p.sub{color:var(--faint);margin:0 0 24px;font-size:12.5px}
.row{display:grid;grid-template-columns:200px 1fr;gap:14px;padding:9px 0;
  border-bottom:1px solid var(--line)}
.k{color:var(--dim)}
.v{word-break:break-all}
.ok{color:var(--accent)}
.bad{color:#ff6b6b}
.wait{color:var(--warn)}
button{font:inherit;cursor:pointer;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line2);border-radius:6px;padding:9px 15px;margin:18px 8px 0 0}
button:hover{background:var(--raise)}
button.primary{color:var(--accent-ink);border-color:transparent;font-weight:700;
  background-image:var(--grad);background-repeat:no-repeat;
  background-size:calc(100% + 2px) 100%;background-position:-1px 0}
#wallets{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
pre{background:var(--void);border:1px solid var(--line);border-radius:6px;
  padding:12px;overflow:auto;font-size:12px;color:var(--dim);margin-top:18px}
</style>
</head>
<body>

<h1>Chain check</h1>
<p class="sub">Does the Solana layer actually work in a browser</p>

<div class="row"><span class="k">metaplex bundle</span><span class="v wait" id="r-bundle">loading…</span></div>
<div class="row"><span class="k">bundle size</span><span class="v" id="r-size">—</span></div>
<div class="row"><span class="k">umi instance</span><span class="v wait" id="r-umi">—</span></div>
<div class="row"><span class="k">rpc (devnet)</span><span class="v wait" id="r-rpc">—</span></div>
<div class="row"><span class="k">core program</span><span class="v wait" id="r-core">—</span></div>
<div class="row"><span class="k">wallets found</span><span class="v wait" id="r-wallets">—</span></div>
<div class="row"><span class="k">connected</span><span class="v" id="r-conn">—</span></div>
<div class="row"><span class="k">balance</span><span class="v" id="r-bal">—</span></div>

<div id="wallets"></div>
<button id="disconnect" hidden>Disconnect</button>

<pre id="log">—</pre>

<script src="/wallet.js"></script>
<script type="module">
const $ = (id) => document.getElementById(id);
const logEl = $("log");
const lines = [];
function log(s) { lines.push(s); logEl.textContent = lines.join("\n"); }
function set(id, text, cls) { const e = $(id); e.textContent = text; e.className = "v " + (cls || ""); }

const DEVNET = "https://api.devnet.solana.com";
let mx = null, umi = null;

try {
  const t0 = performance.now();
  mx = await import("/vendor/metaplex.esm.js");
  const ms = Math.round(performance.now() - t0);
  set("r-bundle", `ok — ${Object.keys(mx).length} exports, ${ms}ms`, "ok");
  log("exports: " + Object.keys(mx).sort().join(", "));

  const head = await fetch("/vendor/metaplex.esm.js", { method: "HEAD" });
  const kb = Math.round((+head.headers.get("content-length") || 0) / 1024);
  set("r-size", kb ? kb + " KB" : "unknown");
} catch (e) {
  set("r-bundle", "FAILED — " + e.message, "bad");
  log("bundle error:\n" + (e.stack || e));
}

if (mx) {
  try {
    umi = mx.createUmi(DEVNET).use(mx.mplCore()).use(mx.mplCandyMachine());
    set("r-umi", "ok — programs registered", "ok");
  } catch (e) {
    set("r-umi", "FAILED — " + e.message, "bad");
    log("umi error:\n" + (e.stack || e));
  }
}

if (umi) {
  try {
    const slot = await umi.rpc.getSlot();
    set("r-rpc", "ok — slot " + slot, "ok");
  } catch (e) {
    set("r-rpc", "FAILED — " + e.message, "bad");
  }
  try {
    // Core's program id, confirmed executable on devnet — proves the bundle's
    // program registration matches a real deployment rather than just parsing.
    const id = umi.programs.get("mplCore").publicKey;
    const acct = await umi.rpc.getAccount(id);
    set("r-core", (acct.exists ? "ok — executable at " : "MISSING at ") + id,
        acct.exists ? "ok" : "bad");
  } catch (e) {
    set("r-core", "FAILED — " + e.message, "bad");
  }
}

/* ---- wallets ---- */
function paintWallets() {
  const found = window.Wallet.list();
  set("r-wallets", found.length ? found.map(w => w.name).join(", ") : "none detected",
      found.length ? "ok" : "wait");
  const box = $("wallets");
  box.innerHTML = "";
  found.forEach(w => {
    const b = document.createElement("button");
    b.className = "primary";
    b.textContent = "Connect " + w.name;
    b.onclick = () => doConnect(w.id);
    box.appendChild(b);
  });
}

async function doConnect(id) {
  try {
    const w = await window.Wallet.connect(id);
    set("r-conn", w.name + " — " + w.publicKey, "ok");
    $("disconnect").hidden = false;
    log("connected: " + w.publicKey);
    if (umi) {
      const bal = await umi.rpc.getBalance(mx.publicKey(w.publicKey));
      set("r-bal", (Number(bal.basisPoints) / 1e9).toFixed(6) + " SOL (devnet)");
    }
  } catch (e) {
    set("r-conn", "FAILED — " + e.message, "bad");
    log("connect error:\n" + (e.stack || e));
  }
}

$("disconnect").onclick = async () => {
  await window.Wallet.disconnect();
  set("r-conn", "—"); set("r-bal", "—");
  $("disconnect").hidden = true;
};

// Wallets can register after page load, so recheck for a moment.
paintWallets();
let tries = 0;
const t = setInterval(() => { paintWallets(); if (++tries > 6) clearInterval(t); }, 400);
</script>
</body>
</html>

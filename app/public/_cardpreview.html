<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>card preview — pfp blur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{background:#222;margin:0;padding:24px;display:grid;gap:22px;font-family:sans-serif}
h3{color:#fff;margin:0 0 6px} img{width:760px;max-width:100%;display:block;border:1px solid #333}</style>
</head><body>
<div id="out"></div>
<script src="/brand.js"></script>
<script src="/cardmaker.js"></script>
<script>
(async () => {
  const cases = [
    { label:"solana — with pfp (blur 30)", o:{ chain:"solana", kind:"collection", name:"moar cat", sym:"MOAR",
        avatar:"/art/pfp.png", stats:[["items","1000"],["price","Free"],["chain","Solana"]] } },
    { label:"robinhood — with pfp (blur 30)", o:{ chain:"robinhood", kind:"token", name:"moar cat", sym:"MOAR",
        avatar:"/art/pfp.png", stats:[["priced in","ETH"],["swap fee","3%"],["chain","Robinhood"]] } }
  ];
  for (const c of cases) {
    let img;
    try { img = URL.createObjectURL(new Blob([await CardMaker.make(c.o)], { type:"image/png" })); }
    catch (e) { img = ""; }
    const div = document.createElement("div");
    div.innerHTML = '<h3>'+c.label+'</h3>' + (img ? '<img src="'+img+'">' : '<p style="color:#f66">failed</p>');
    document.getElementById("out").appendChild(div);
  }
  document.body.setAttribute("data-done","1");
})();
</script>
</body></html>

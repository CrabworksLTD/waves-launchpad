<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAVES Launchpad</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
/* The trading page. Left: the bonding curve drawn from live pool state with
 * the current position marked — deterministic, no indexer required, unlike a
 * candle chart which needs trade history we do not index yet. Right: the
 * trade box. Everything readable renders before any wallet connects. */
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;min-height:100%}
body{background:var(--void);color:var(--ink);font:400 15px/1.6 Inter,sans-serif;
  -webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",monospace}
a{color:inherit;text-decoration:none}
main{max-width:1420px;margin:0 auto;padding:26px 24px 90px}

/* ---- hero: the mint page's shape — banner behind, identity on it ---- */
.hero{position:relative;border-bottom:1px solid var(--line);overflow:hidden}
.hero .bg{position:absolute;inset:0;background:var(--panel);overflow:hidden}
.hero .bg img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;
  display:block;filter:brightness(.55)}
.hero .bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.45) 45%,rgba(0,0,0,.6) 100%)}
.hero-in{position:relative;max-width:1420px;margin:0 auto;padding:44px 24px 40px}
.who{display:flex;flex-direction:column;gap:16px;min-width:0;max-width:720px;align-items:flex-start}
.logo{width:84px;height:84px;border-radius:12px;background:var(--raise);flex:none;
  border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;
  font:800 26px Archivo;color:var(--faint);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}
.who h1{font-family:Archivo;font-size:clamp(28px,3.6vw,44px);font-weight:800;
  letter-spacing:-.02em;margin:0;background:var(--grad);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.who .sym{-webkit-text-fill-color:var(--faint);color:var(--faint);
  font-size:16px;margin-left:10px;letter-spacing:0}
/* what holders are paid in, worn next to the ticker — the reward asset is
   part of what this token IS, not a footnote further down the page */
.who .rsym{-webkit-text-fill-color:var(--accent);color:var(--accent);
  font-size:16px;letter-spacing:0}
.socials{display:flex;gap:8px;flex-wrap:wrap}
.socials a{display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border:1px solid rgba(255,255,255,.22);border-radius:99px;
  font:500 12px Inter,sans-serif;color:var(--dim);background:rgba(0,0,0,.4);
  transition:color .18s,border-color .18s}
.socials a:hover{color:var(--ink);border-color:var(--faint)}
.socials a i{font-style:normal;color:var(--faint);font-size:10px}
/* socials are marks, not words — a round button per platform */
.socials a.ic{width:34px;height:34px;padding:0;justify-content:center;border-radius:99px}
.socials a.ic svg{width:15px;height:15px;display:block;fill:currentColor}
.socials a.ic img{width:16px;height:16px;display:block;border-radius:3px}
/* the share mark is drawn with strokes, not fills — the rule above would
   flood its open paths */
.socials a#share svg{fill:none;stroke:currentColor;stroke-width:2}
/* the contract address: a line of text you can click, not a form field */
.ca{display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  font:400 12.5px "IBM Plex Mono",monospace;color:var(--faint);
  background:none;border:0;padding:0;transition:color .18s}
.ca:hover{color:var(--dim)}
.ca svg{width:13px;height:13px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.ca.did{color:var(--accent)}
#ca-said{font-size:11px;letter-spacing:.08em;text-transform:uppercase}

/* trade box and chart share a row and a height; history sits under both */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:stretch}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;
  display:flex;flex-direction:column}
.panel.chartp{min-height:440px;order:1}
.panel.tradep{order:2}
#curve{width:100%;flex:1;min-height:260px;display:block}

/* recent trades */
.hist{margin-top:20px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:18px}
.hist .hh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.hist .hh b{font:800 15px Archivo}
.htab{background:none;border:0;padding:0 0 6px;margin-right:18px;cursor:pointer;
  font:800 15px Archivo;color:var(--faint);border-bottom:2px solid transparent;
  transition:color .18s,border-color .18s}
.htab:hover{color:var(--dim)}
.htab.on{color:var(--ink);border-bottom-color:var(--accent)}
/* a holder row: rank, who, how much, and the share that actually matters */
.hrow{display:flex;align-items:center;gap:12px;padding:11px 6px;
  border-top:1px solid var(--line);font-size:13px}
.hrow:first-of-type{border-top:0}
.hrow .rk{width:22px;flex:none;font:600 12px "IBM Plex Mono",monospace;color:var(--faint)}
.hrow .who{flex:none;width:96px;font:400 12.5px "IBM Plex Mono",monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the amount takes the slack so the percentage sits in a fixed column;
   tabular figures keep the digits from wandering row to row */
.hrow .amt2{flex:1;min-width:0;text-align:right;
  font:500 12.5px "IBM Plex Mono",monospace;color:var(--dim);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.hrow .pct{flex:none;width:68px;text-align:right;
  font:600 13px "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.hrow.big .pct{color:var(--accent)}
.hist .hh span{margin-left:auto;font:400 11.5px "IBM Plex Mono",monospace;color:var(--faint)}
.trow{display:flex;align-items:center;gap:12px;padding:11px 6px;
  border-top:1px solid var(--line);font-size:13px}
.trow:first-of-type{border-top:0}
.trow .dir{width:22px;flex:none;font:700 14px Archivo;text-align:center}
.trow .dir.buy{color:var(--accent)}
.trow .dir.sell{color:#ff8f8f}
.trow .amt{min-width:0;flex:1}
.trow .amt b{display:block;font:600 13.5px "IBM Plex Mono",monospace}
.trow .amt span{display:block;font:400 11px "IBM Plex Mono",monospace;color:var(--faint)}
.trow .val{text-align:right;flex:none}
.trow .val b{display:block;font:600 13px "IBM Plex Mono",monospace}
.trow .val span{display:block;font:400 11px "IBM Plex Mono",monospace;color:var(--faint)}
.hist .empty{padding:26px 6px;text-align:center;color:var(--faint);font-size:13px}

/* holding this token pays you — the single most relevant fact to someone
   looking at the buy box, and it was nowhere on the page */
.rewards{margin-top:12px;padding:12px 13px;border-radius:10px;
  border:1px solid rgba(var(--accent-rgb),.35);background:rgba(var(--accent-rgb),.06)}
.rewards b{display:block;font:700 13px Archivo;color:var(--accent)}
.rewards span{display:block;margin-top:3px;font-size:11.5px;color:var(--dim)}
.rewards .asset{display:inline-flex;align-items:center;gap:5px;
  font:600 11.5px "IBM Plex Mono",monospace;color:var(--ink)}
/* fees since deploy, sat under the "rewards are active" line inside the badge */
.rewards .rfees{display:flex;gap:22px;margin-top:11px;padding-top:11px;
  border-top:1px solid rgba(var(--accent-rgb),.2)}
.rewards .rfees span{display:block;margin-top:0;font:500 9.5px "IBM Plex Mono",monospace;
  letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.rewards .rfees b{display:block;margin-top:4px;font:700 14px "IBM Plex Mono",monospace;color:var(--ink)}
.rewards .rfees .rf-dist{color:var(--accent)}

/* the collection this token was paired with, and where its holders stake */
.pairlink{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 13px;
  border:1px solid transparent;border-radius:10px;text-decoration:none;
  background:linear-gradient(var(--panel2),var(--panel2)) padding-box,var(--grad) border-box;
  transition:filter .2s}
.pairlink:hover{filter:brightness(1.15)}
.pairlink .c{width:30px;height:30px;flex:none;border-radius:7px;overflow:hidden;
  background:var(--panel);display:grid;place-items:center;font:800 13px Archivo}
.pairlink .c img{width:100%;height:100%;object-fit:cover;display:block}
.pairlink b{display:block;font:700 13px Archivo}
.pairlink span.s{display:block;font-size:11px;color:var(--faint)}
.pairlink .arw{margin-left:auto;flex:none;font:700 16px Archivo;color:var(--accent)}
.pairlink>span:nth-child(2){min-width:0;flex:1}
.pairlink b,.pairlink span.s,.pairlink span:nth-child(2)>span{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* stats + curve — two rows of four, so nothing is cramped and the numbers
   line up in columns you can read down */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 0;margin-bottom:14px}
.stat{padding:4px 10px;border-right:1px solid var(--line)}
.stat:nth-child(4n),.stat:last-child{border-right:0}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2n){border-right:0}
  .stat:nth-child(4n){border-right:1px solid var(--line)}
}
.stat .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.stat b{display:block;font:600 15px "IBM Plex Mono",monospace;margin-top:2px}
.stat em{display:block;font:600 11px "IBM Plex Mono",monospace;font-style:normal;
  margin-top:2px;color:var(--faint)}
.stat em.up{color:var(--accent)}
.stat em.down{color:#ff8f8f}
/* timeframe rail — sits on the chart's top edge, right-aligned so it reads as
   a control on the chart rather than another row of page furniture */
.tfrow{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.tfrow .lbl{font:400 11.5px "IBM Plex Mono",monospace;color:var(--faint)}
.tf{margin-left:auto;display:flex;gap:2px;padding:3px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line)}
.tf button{padding:5px 11px;border:0;border-radius:999px;background:transparent;
  color:var(--faint);font:600 11px "IBM Plex Mono",monospace;letter-spacing:.04em;
  cursor:pointer;transition:color .18s,background .18s}
.tf button:hover{color:var(--ink)}
.tf button.on{background:var(--panel);color:var(--ink)}
#curve{width:100%;height:400px;display:block}
.bar{height:7px;border-radius:99px;background:var(--raise);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;transition:width .5s;
  background-image:var(--grad);background-repeat:no-repeat;
  background-size:calc(100% + 2px) 100%;background-position:-1px 0}
.barlb{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:6px}

/* trade box */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;font:700 13.5px Archivo;padding:11px;border-radius:8px;cursor:pointer;
  background:var(--panel2);color:var(--dim);border:1px solid transparent}
.tabs button.on.buy{background:rgba(var(--accent-rgb),.14);color:var(--accent);
  border-color:rgba(var(--accent-rgb),.4)}
.tabs button.on.sell{background:rgba(255,107,107,.12);color:#ff8f8f;
  border-color:rgba(255,107,107,.4)}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin:10px 0 6px}
input{width:100%;background:var(--void);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:11px 12px;font:500 15px "IBM Plex Mono",monospace}
input:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:6px;margin-top:8px}
.chips button{flex:1;font:600 12px Inter;padding:7px;border-radius:6px;cursor:pointer;
  background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.chips button:hover{color:var(--ink)}
.est{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);
  padding:12px 2px 2px}
.est b{font-family:"IBM Plex Mono",monospace}
.go{width:100%;margin-top:14px;padding:14px;border-radius:8px;border:0;cursor:pointer;
  font:800 14px Archivo;color:var(--accent-ink);
  background-image:var(--grad);background-repeat:no-repeat;
  background-size:calc(100% + 2px) 100%;background-position:-1px 0}
.go:disabled{opacity:.45;cursor:default}
.msg{margin-top:12px;font-size:12.5px;padding:10px 12px;border-radius:8px;display:none}
.msg.err{display:block;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.35);color:#ffb3b3}
.msg.ok{display:block;background:rgba(var(--accent-rgb),.08);border:1px solid rgba(var(--accent-rgb),.3);color:#8ff5cd}
.msg a{color:inherit;text-decoration:underline}
.note{color:var(--faint);font-size:11.5px;margin-top:10px;line-height:1.5}
.desc{color:var(--dim);font-size:13.5px;margin-top:16px;max-width:70ch}
</style>
</head>
<body>
<header class="hero">
  <div class="bg"><img alt="" id="tbanner-img" hidden></div>
  <div class="hero-in">
    <div class="who">
      <div class="logo" id="logo">?</div>
      <h1 id="name">Loading…<span class="sym" id="sym"></span><span class="rsym" id="rsym" hidden></span></h1>
      <button class="ca" id="ca-copy" title="Copy the contract address">
        <code id="ca">—</code>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/>
        <path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <span id="ca-said"></span>
      </button>
      <div class="socials" id="socials"></div>
    </div>
  </div>
</header>

<main>
  <div class="grid">
    <div class="panel tradep">
      <div class="tabs">
        <button class="on buy" id="t-buy">Buy</button>
        <button class="sell" id="t-sell">Sell</button>
      </div>
      <!-- Both of these are rewritten by setSide() at boot: the currency is not
           known until the mint is, and a Robinhood token priced in SOL is a lie
           on the one screen where the number means money. -->
      <label id="amt-label">Amount</label>
      <input id="amt" type="number" min="0" step="0.01" placeholder="0.0">
      <div class="chips" id="chips">
        <button data-v="0.01">0.01</button><button data-v="0.025">0.025</button>
        <button data-v="0.05">0.05</button><button data-v="0.1">0.1</button>
      </div>
      <div class="est"><span>You receive ≈</span><b id="est">—</b></div>
      <div class="est"><span>Slippage</span><b>1%</b></div>
      <button class="go" id="go" disabled>Loading…</button>
      <div class="msg" id="msg"></div>
      <a class="pairlink" id="pairlink" hidden></a>
      <a class="pairlink" id="stakelink" hidden></a>
      <div class="rewards" id="rewards" hidden></div>
      <!-- The fee split lives in the docs. Someone at a buy box needs to know
           how trading works here, not how the fee is apportioned three ways —
           and on a pledged token that breakdown was misleading anyway, since
           most of the creator's share goes straight back to holders. -->
      <p class="note">Trades run against the bonding curve — no order book, no
      liquidity providers. <a href="/docs#fees">How fees work ↗</a></p>
    </div>

    <div class="panel chartp">
      <div class="stats">
        <div class="stat"><span class="k">Price</span><b id="s-price">—</b>
          <em id="s-chg"></em></div>
        <div class="stat"><span class="k">Market cap</span><b id="s-mcap">—</b>
          <em id="s-supply"></em></div>
        <div class="stat"><span class="k">Volume 24h</span><b id="s-vol">—</b>
          <em id="s-trades"></em></div>
        <div class="stat"><span class="k">Holders</span><b id="s-holders">—</b></div>
        <div class="stat"><span class="k">All-time high</span><b id="s-ath">—</b>
          <em id="s-athat"></em></div>
        <div class="stat"><span class="k">Raised</span><b id="s-raised">—</b>
          <em id="s-raised-n"></em></div>
        <div class="stat"><span class="k">Graduates at</span><b id="s-grad">—</b>
          <em id="s-grad-n"></em></div>
        <div class="stat"><span class="k">Status</span><b id="s-status">—</b></div>
      </div>
      <div class="tfrow">
        <span class="lbl" id="tf-note"></span>
        <div class="tf" id="tf">
          <button data-tf="1h">1H</button>
          <button data-tf="6h">6H</button>
          <button data-tf="1d">1D</button>
          <button data-tf="7d">7D</button>
          <button data-tf="all" class="on">ALL</button>
        </div>
      </div>
      <canvas id="curve"></canvas>
      <div class="bar"><i id="bar"></i></div>
      <div class="barlb"><span id="pct">—</span><span>graduation → Meteora DAMM v2, LP locked</span></div>
      <p class="desc" id="desc"></p>
    </div>

  </div>

  <div class="hist">
    <div class="hh">
      <button class="htab on" data-h="trades">Recent trades</button>
      <button class="htab" data-h="holders">Holders</button>
      <!-- only ever real status: "no pool recorded", a read failure.
           A count of visible rows is not news. -->
      <span id="hist-note"></span>
    </div>
    <div id="hist"></div>
    <div id="holders" hidden></div>
  </div>
</main>

<script src="/brand.js"></script>
<script src="/ui.js"></script>
<script src="/wallet.js"></script>
<script src="/shell.js"></script>
<script src="/launch.js"></script>
<script src="/token.js"></script>
<script src="/share-widget.js"></script>
<script>
(function () {
  "use strict";
  var esc = UI.esc;
  Shell.mount({ search: false });

  var qs = new URLSearchParams(location.search);
  if (qs.get("cluster")) window.Launch.cluster(qs.get("cluster"));
  /* A Robinhood token is a 0x contract address, not a base58 mint. Matching only
   * base58 meant an EVM token page never found its own address and rendered
   * empty. */
  var MINT = (location.pathname.match(/\/token\/(0x[0-9a-fA-F]{40}|[1-9A-HJ-NP-Za-km-z]{32,44})/) || [])[1]
          || qs.get("mint") || "";
  var IS_EVM = /^0x[0-9a-fA-F]{40}$/.test(MINT);

  /* The trade box speaks to one object: balance, quote, swap. On Solana that is
   * window.Token; on Robinhood it is an adapter over our own curve with the
   * same three methods. Choosing here rather than branching inside every
   * handler keeps the buy/sell UI, the chips, the debounced requoting and the
   * error handling shared instead of written twice and drifting. */
  var tk = IS_EVM ? null : window.Token;
  var tkReady = IS_EVM
    ? Shell.ensureEvmLaunch().then(function () { tk = window.MoonpadToken.adapter(); })
    : Promise.resolve();

  function currentWallet() {
    return IS_EVM ? ((window.MoonpadWallet || {}).account || null)
                  : (window.Wallet && window.Wallet.current());
  }
  var $ = function (id) { return document.getElementById(id); };

  /* Read art through the mirror.
   *
   * arweave.net cannot serve a fresh upload for minutes, and that is exactly
   * when a launch is being looked at. /api/mirror returns our short-lived copy
   * if it has one and redirects to Arweave otherwise, so this is safe to use
   * unconditionally and needs no knowledge of which case applies. */
  function art(u) {
    return u && /^https:\/\/arweave\.net\//.test(u)
      ? "/api/mirror?u=" + encodeURIComponent(u) : u;
  }
  var side = "buy", market = null, lastQuote = null, quoteSeq = 0, poolHint = null;

  function say(k, h) { var m = $("msg"); m.className = "msg " + k; m.innerHTML = h; }

  if (!MINT) { $("name").textContent = "No token"; say("err", "This link is missing a mint address."); }
  else {
    $("ca").textContent = MINT;
    $("ca-copy").onclick = function () {
      navigator.clipboard.writeText(MINT).then(function () {
        var b = $("ca-copy");
        b.classList.add("did");
        $("ca-said").textContent = "copied";
        setTimeout(function () {
          b.classList.remove("did");
          $("ca-said").textContent = "";
        }, 1400);
      });
    };
    load();
  }

  /* The row under the address: where this token lives on chain, then wherever
   * its creator lives. Explorer links are always available because they are
   * derived from addresses we already have; socials come from the token's own
   * metadata, so they are the creator's, not ours to invent. */
  function explorer(addr) {
    return "https://explorer.solana.com/address/" + addr +
      (window.Launch.cluster() === "devnet" ? "?cluster=devnet" : "");
  }
  function renderLinks(meta) {
    /* No explorer pills. The contract address is already on the line above
     * with a copy button, and an explorer link is a way OUT of a trading page
     * — the row is for the project's own places and for sharing. */
    var out = [];
    /* DexScreener, by token address — their /solana/<address> form resolves to
     * whichever pair they have indexed. Mainnet only, and it can be empty for a
     * few minutes after a launch until they pick the pool up. */
    if (window.Launch.cluster() === "mainnet-beta") {
      out.push('<a class="ic" href="https://dexscreener.com/solana/' + esc(MINT) +
        '" target="_blank" rel="noopener" title="DexScreener" aria-label="DexScreener">' +
        '<img src="/art/dexscreener.png" alt="" width="16" height="16"></a>');
    }

    // Share is a mark, like the socials — the row reads as icons, not a
    // sentence, and the glyph is understood everywhere.
    out.push('<a class="ic" id="share" href="#" title="Share" aria-label="Share">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 13.4l7.4 4.3M15.7 6.3l-7.4 4.3"/></svg>' + "</a>");
    // brand marks, so the row stays short whatever a creator fills in
    var MARK = {
      website: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 9h-3a15.6 15.6 0 0 0-1.1-5.2A8 8 0 0 1 18.9 11ZM12 4.1c.7 1 1.6 3 1.8 6.9h-3.6c.2-3.9 1.1-5.9 1.8-6.9ZM5.1 11a8 8 0 0 1 4.1-5.2A15.6 15.6 0 0 0 8.1 11Zm0 2h3a15.6 15.6 0 0 0 1.1 5.2A8 8 0 0 1 5.1 13Zm6.9 6.9c-.7-1-1.6-3-1.8-6.9h3.6c-.2 3.9-1.1 5.9-1.8 6.9Zm2.8-1.7a15.6 15.6 0 0 0 1.1-5.2h3a8 8 0 0 1-4.1 5.2Z"/></svg>',
      twitter: '<svg viewBox="0 0 24 24"><path d="M18.9 2H22l-7 8 8.2 12h-6.4l-5-7.3L5.6 22H2.5l7.5-8.6L2 2h6.6l4.6 6.7Zm-1.1 18h1.7L7.3 3.8H5.5Z"/></svg>',
      telegram: '<svg viewBox="0 0 24 24"><path d="M21.9 4.3 18.9 19c-.2 1-.8 1.3-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.5-1 .5l.3-4.7L18.3 6c.4-.3-.1-.5-.6-.2L6.9 12.7l-4.6-1.4c-1-.3-1-1 .2-1.5l18-6.9c.8-.3 1.6.2 1.4 1.4Z"/></svg>',
      discord: '<svg viewBox="0 0 24 24"><path d="M19.3 5.3A16.8 16.8 0 0 0 15.1 4l-.2.4a12.7 12.7 0 0 1 3.7 1.9 13.4 13.4 0 0 0-11.2 0A12.7 12.7 0 0 1 11 4.4L10.9 4a16.8 16.8 0 0 0-4.2 1.3C3.9 9.4 3.2 13.4 3.5 17.4a16.9 16.9 0 0 0 5.1 2.6l.7-1.2a11 11 0 0 1-1.7-.8l.4-.3a12.1 12.1 0 0 0 10 0l.4.3a11 11 0 0 1-1.7.8l.7 1.2a16.9 16.9 0 0 0 5.1-2.6c.4-4.6-.7-8.6-3.2-12.1ZM9.7 15.1c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm4.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/></svg>'
    };
    var ext = (meta && meta.extensions) || {};
    var order = [["website", "Website"], ["twitter", "X"], ["telegram", "Telegram"],
                 ["discord", "Discord"]];
    order.forEach(function (kv) {
      var v = ext[kv[0]];
      if (!v) return;
      var href = /^https?:/.test(v) ? v
        : kv[0] === "twitter" ? "https://x.com/" + String(v).replace(/^@/, "")
        : "https://" + v;
      out.push('<a class="ic" title="' + kv[1] + '" aria-label="' + kv[1] +
        '" href="' + esc(href) + '" target="_blank" rel="noopener">' + MARK[kv[0]] + "</a>");
    });
    $("socials").innerHTML = out.join("");
    var sb = $("share");
    if (sb) sb.onclick = function (e) {
      e.preventDefault();
      window.WavesShare.open({
        id: MINT, to: "token",
        name: ($("name") ? $("name").firstChild.textContent.trim() : "This token"),
        title: "token"
      });
    };
  }

  /* Recent trades, straight off the pool. Rendered after the page is usable
   * because it is a dozen RPC round trips — the trade box must never wait on
   * history to become interactive. */
  function shortWho(a) { return a ? a.slice(0, 4) + "…" + a.slice(-4) : ""; }
  function agoShort(ts) {
    if (!ts) return "";
    var s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return s + "s";
    if (s < 3600) return Math.floor(s / 60) + "m";
    if (s < 86400) return Math.floor(s / 3600) + "h";
    return Math.floor(s / 86400) + "d";
  }
  /* Index on demand when the page has nothing to show.
   *
   * A token opened minutes after launching had "—" holders and an empty chart
   * until the ten-minute cron came round, which reads as broken on exactly the
   * visit that matters. If the stats come back unindexed, ask for a run and
   * reload once. Cheap, bounded to a single retry, and it means a brand-new
   * token fills itself in rather than waiting on a schedule. */
  var healed = false;
  async function healIfEmpty(d) {
    if (healed) return false;
    var s = d && d.stats;
    var empty = !d || d.indexed === false || !s || s.holders == null;
    if (!empty) return false;
    healed = true;
    try {
      await fetch("/api/indexer?mint=" + encodeURIComponent(MINT));
      return true;
    } catch (e) { return false; }
  }

  /* The indexer (api/indexer.js, every 10 minutes) is the source for history:
   * price series, volume, market cap, holders, ATH. It reads each swap from the
   * pool's own vault movements, which the page cannot do cheaply — walking the
   * signature list on every load cost a second or two and still could not say
   * what the price was yesterday.
   *
   * If it has not indexed this token yet, fall back to reading the chain
   * directly, which is what the page always did. A launch minutes old should
   * not look dead while it waits for the first cron. */
  var tf = "all";
  var QUOTE = "SOL";                    // replaced by the pool's real quote symbol
  var USD = null;                       // quote asset in dollars, from the indexer

  /* Money, written the way people read it.
   *
   * A launch token's price has a lot of leading zeros, and "2.77e-8" is not a
   * price anybody can compare at a glance. The convention every trading UI
   * settled on is a subscript run-length: $0.0₇277 means seven zeros then 277.
   * Large figures get K/M/B, because "27.73 SOL" of market cap is a number in
   * the wrong unit AND the wrong shape. */
  var SUBS = "₀₁₂₃₄₅₆₇₈₉";
  function subs(n) {
    return String(n).split("").map(function (d) { return SUBS[+d]; }).join("");
  }
  function usdSmall(n) {
    var m = n.toFixed(20).match(/^0\.(0*)(\d+)/);
    if (!m) return "$" + n.toPrecision(3);
    var zeros = m[1].length;
    var digits = m[2].slice(0, 4).replace(/0+$/, "") || "0";
    return zeros >= 4
      ? "$0.0" + subs(zeros) + digits
      : "$0." + m[1] + digits;
  }
  function money(n) {
    if (n == null || !isFinite(n)) return "—";
    if (n >= 1e9) return "$" + (n / 1e9).toFixed(2) + "B";
    if (n >= 1e6) return "$" + (n / 1e6).toFixed(2) + "M";
    if (n >= 1e3) return "$" + (n / 1e3).toFixed(1) + "K";
    if (n >= 1) return "$" + n.toFixed(2);
    if (n > 0) return usdSmall(n);
    return "$0";
  }
  // native units stay available as the small line under a figure, so the curve
  // is still readable in the currency it actually trades in
  function native(n, dp) {
    return UI.fmt(n, dp == null ? 2 : dp) + " " + QUOTE;
  }

  function loadStats() {
    return fetch("/api/stats?mint=" + encodeURIComponent(MINT) + "&tf=" + tf)
      .then(function (r) { return r.json(); })
      .then(async function (d) {
        // a token launched moments ago has nothing yet — ask for a run, once
        if (await healIfEmpty(d)) {
          d = await fetch("/api/stats?mint=" + encodeURIComponent(MINT) + "&tf=" + tf)
            .then(function (r) { return r.json(); }).catch(function () { return d; });
        }
        if (!d.indexed || !d.stats) return false;
        var s = d.stats;
        var sym = ($("sym").textContent || "").replace(/^\$/, "");

        USD = s.quoteUsd || null;

        if (s.price != null) {
          $("s-price").textContent = USD ? money(s.price * USD) : s.price.toPrecision(3);
        }
        setChange(d.change);
        if (s.mcap != null) {
          $("s-mcap").textContent = USD ? money(s.mcap * USD) : native(s.mcap);
          $("s-supply").textContent = s.supply ? UI.fmt(s.supply, 0) + " supply" : "";
        }
        var vol = d.windowVol || 0;
        $("s-vol").textContent = USD ? money(vol * USD) : native(vol);
        $("s-trades").textContent = (d.windowTrades || 0) + " trades";
        $("s-holders").textContent = s.holders == null ? "—" : s.holders.toLocaleString();
        if (s.ath) {
          $("s-ath").textContent = USD ? money(s.ath * USD) : s.ath.toPrecision(3);
          $("s-athat").textContent = s.athAt ? agoShort(s.athAt) + " ago" : "";
        }
        // the curve's own numbers, restated in dollars with the native amount
        // underneath — the pool still thinks in its quote currency
        if (market) {
          $("s-raised").textContent = USD ? money(market.raised * USD) : native(market.raised);
          $("s-raised-n").textContent = native(market.raised);
          $("s-grad").textContent = USD ? money(market.threshold * USD) : native(market.threshold, 0);
          $("s-grad-n").textContent = native(market.threshold, 0);
        }

        if (d.points && d.points.length >= 2) {
          drawPrice(d.points.map(function (p) { return { at: p.at, price: p.price }; }));
          $("tf-note").textContent = "";
        } else {
          $("tf-note").textContent = d.points && d.points.length
            ? "only one trade in this window" : "no trades in this window";
        }

        drawHolders(s);

        if (d.trades && d.trades.length) {
          $("hist-note").textContent = "";
          $("hist").innerHTML = d.trades.map(function (t) {
            var url = IS_EVM ? tk.txUrl(t.sig) : "https://explorer.solana.com/tx/" + t.sig;
        return '<a class="trow" href="' + esc(url) +
              '" target="_blank" rel="noopener">' +
              '<span class="dir ' + t.side + '">' + (t.side === "buy" ? "↗" : "↙") + "</span>" +
              '<span class="amt"><b>' + UI.fmt(t.tokens, 2) + " " + esc(sym) + "</b>" +
                "<span>" + esc(shortWho(t.who)) + "</span></span>" +
              '<span class="val"><b>' +
                (USD ? money(t.quote * USD) : UI.fmt(t.quote, 4) + " " + QUOTE) + "</b>" +
                "<span>" + agoShort(t.at) + " ago</span></span></a>";
          }).join("");
        } else {
          $("hist-note").textContent = "";
          $("hist").innerHTML = '<div class="empty">No trades in this window.</div>';
        }
        return true;
      })
      .catch(function () { return false; });
  }

  /* Who holds it, and how much of it.
   *
   * The first question anyone asks about a new token is how concentrated it
   * is — one wallet holding 40% is the whole story, and it is the thing a
   * chart cannot tell you. The indexer already reads every token account to
   * count holders, so the list costs nothing extra. */
  function drawHolders(s) {
    var box = $("holders");
    var top = (s && s.top) || null;
    if (!top || !top.length) {
      box.innerHTML = '<div class="empty">' +
        (s && s.holders ? "Holder list is still being read." : "Nobody holds it yet.") +
        "</div>";
      return;
    }
    var sym = ($("sym").textContent || "").replace(/^\$/, "");
    box.innerHTML = top.map(function (h, i) {
      return '<a class="hrow' + (h.pct >= 10 ? " big" : "") +
        '" href="https://explorer.solana.com/address/' + esc(h.owner) +
        '" target="_blank" rel="noopener">' +
        '<span class="rk">' + (i + 1) + "</span>" +
        '<span class="who">' + esc(shortWho(h.owner)) + "</span>" +
        '<span class="amt2">' + UI.fmt(h.amount, 0) + " " + esc(sym) + "</span>" +
        '<span class="pct">' + h.pct.toFixed(1) + "%</span></a>";
    }).join("");
  }

  // the two panes share one header; only one is ever visible
  document.querySelector(".hist .hh").addEventListener("click", function (e) {
    var b = e.target.closest(".htab");
    if (!b) return;
    var want = b.dataset.h;
    this.querySelectorAll(".htab").forEach(function (t) {
      t.classList.toggle("on", t === b);
    });
    $("hist").hidden = want !== "trades";
    $("holders").hidden = want !== "holders";
    // that count belongs to the trade feed; on the holders tab it was just a
    // number from the other pane sitting above an unrelated list
    $("hist-note").hidden = want !== "trades";
  });

  function setChange(chg) {
    var cel = $("s-chg");
    if (!cel) return;
    if (chg == null) { cel.textContent = ""; cel.className = ""; return; }
    var pc = chg * 100;
    cel.textContent = (pc >= 0 ? "+" : "") + pc.toFixed(1) + "%";
    cel.className = pc >= 0 ? "up" : "down";
  }

  document.getElementById("tf").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    tf = b.dataset.tf;
    [].forEach.call(this.children, function (x) { x.classList.toggle("on", x === b); });
    $("tf-note").textContent = "…";
    loadStats();
  });

  function loadTrades() {
    if (!poolHint) { $("hist-note").textContent = "no pool recorded"; return; }
    (IS_EVM
      ? tkReady.then(function () { return tk.recentTrades(MINT, 15); })
      : window.Token.recentTrades(MINT, poolHint, 15)).then(function (list) {
      if (!list.length) {
        $("hist-note").textContent = "";
        $("hist").innerHTML = '<div class="empty">No trades yet — the first one shows up here.</div>';
        return;
      }
      $("hist-note").textContent = "";
      /* Same reads, two uses: oldest first, price = SOL per token. Trades with
       * no token or no SOL side (a pool creation, say) carry no price. */
      var series = list.filter(function (t) { return t.tokens > 0 && t.sol > 0; })
        .map(function (t) { return { at: t.at, price: t.sol / t.tokens }; })
        .sort(function (a, b) { return a.at - b.at; });
      if (series.length >= 2) {
        drawPrice(series);
        var first = series[0].price, now = series[series.length - 1].price;
        var chg = first > 0 ? ((now - first) / first) * 100 : 0;
        $("s-price").textContent = now.toPrecision(3);
        var cel = $("s-chg");
        if (cel) {
          cel.textContent = (chg >= 0 ? "+" : "") + chg.toFixed(1) + "%";
          cel.className = chg >= 0 ? "up" : "down";
        }
      }
      $("hist").innerHTML = list.map(function (t) {
        return '<a class="trow" href="https://explorer.solana.com/tx/' + esc(t.sig) +
          '" target="_blank" rel="noopener">' +
          '<span class="dir ' + t.side + '">' + (t.side === "buy" ? "↗" : "↙") + "</span>" +
          '<span class="amt"><b>' + UI.fmt(t.tokens, 2) + " " +
            esc(($("sym").textContent || "").replace(/^\$/, "")) + "</b>" +
            "<span>" + esc(shortWho(t.who)) + "</span></span>" +
          '<span class="val"><b>' + UI.fmt(t.sol, 4) + (IS_EVM ? " ETH" : " SOL") + "</b>" +
            "<span>" + agoShort(t.at) + " ago</span></span></a>";
      }).join("");
    }).catch(function () {
      $("hist-note").textContent = "";
      $("hist").innerHTML = '<div class="empty">Could not read trade history right now.</div>';
    });
  }

  /* What holding this token actually pays.
   *
   * A pledged launch sends a share of every trade to the people holding it,
   * hourly and automatically — which is the most relevant fact to anyone
   * looking at the buy box, and it appeared nowhere on the page. The reward
   * asset is the creator's choice; when nothing trades it yet, holders are
   * paid the quote currency until it can be sold, and saying so here is the
   * same honesty the launch window owes the creator. */
  async function drawRewards(rec) {
    var pct = rec && rec.feeSharePct;
    if (!pct || pct <= 0) return;

    /* Intent is not the same as active.
     *
     * A creator picks a reward asset at launch, but nothing is actually routed
     * to holders until they hand the pool's creator role to our keeper — a
     * separate signature, taken on the fee page. Until that lands the fees are
     * simply theirs, so saying "holders earn rewards" here would be a promise
     * the chain is not keeping.
     *
     * `rewardsActivatedAt` IS that landing, recorded: api/rewards.js only writes
     * it after reading the pool and confirming the creator role now belongs to
     * the keeper. So the record is an on-chain-verified, one-way, permanent
     * fact — trust it. Re-reading the pool with a fresh getPool on every page
     * load made the badge flicker out whenever that RPC lost the cold-start
     * race against the vendor bundles or hit a transient limit (2026-09-02:
     * $MOAR's rewards were live, verified creator == keeper, yet the indicator
     * showed only intermittently). Fall back to the live check only for older
     * records saved before this flag existed. */
    var active = !!rec.rewardsActivatedAt;
    if (!active) {
      try {
        active = IS_EVM
          ? await tk.rewardsActive(rec.mint)
          : await window.Token.rewardsActive(rec.pool || null, rec.mint);
      } catch (e) { active = false; }
    }
    if (!active) return;

    var box = $("rewards");
    var asset = rec.rewardMint || null;

    /* The fees for this reward token, filled into the badge below. Fetched once;
     * rendered whenever BOTH the badge DOM (paint) and the numbers are ready —
     * either can win the race, so both paths call renderFees(). */
    var feeData = null;
    fetchRewardFees(rec).then(function (f) { feeData = f; renderFees(); });
    function renderFees() {
      if (!feeData) return;
      var el = box.querySelector(".rfees");
      if (!el) return;
      el.querySelector(".rf-accrued").textContent = feeData.accrued;
      el.querySelector(".rf-dist").textContent = feeData.distributed;
      el.hidden = false;
    }

    /* One line, then the fees since deploy. The mechanics — hourly, pro-rata,
     * nothing to claim — are true but nobody reads a paragraph in a buy box;
     * what matters is that holding this pays you, in what, and how much it has
     * paid so far. */
    function paint(sym, tradeable) {
      var a = sym || QUOTE;
      box.innerHTML = "<b>" + esc(a) + " rewards are active</b>" +
        (sym && !tradeable
          ? "<span>Paid in " + esc(QUOTE) + " until " + esc(sym) + " is tradeable.</span>"
          : "") +
        '<div class="rfees" hidden>' +
          '<div><span>Fees accrued</span><b class="rf-accrued">—</b></div>' +
          '<div><span>Distributed</span><b class="rf-dist">—</b></div>' +
        "</div>";
      box.hidden = false;
      // the ticker carries it too, so it is visible without scrolling
      var slash = $("rsym");
      if (slash) { slash.textContent = "/" + a; slash.hidden = false; }
      renderFees();          // the numbers may have resolved before this paint
    }

    if (!asset) return paint(null, true);
    // the picker's list carries both the ticker and whether anything trades it
    // RWA reward assets are a Solana-side feature; paint the plain state
    if (IS_EVM) return paint(null, true);
    window.Token.rwa().then(function (list) {
      var hit = (list || []).find(function (t) { return t.mint === asset; });
      if (!hit) return paint(null, true);
      paint(hit.symbol, (hit.liquidity || 0) >= 1000);
    }).catch(function () { paint(null, true); });
  }

  /* Fees for a holder-reward token — total accrued to the reward stream SINCE
   * DEPLOY, and how much has reached holders. Accrued = every creator-side fee
   * the keeper has claimed (/api/payouts claimedRaw) PLUS whatever is unclaimed
   * on the pool right now (feeMetrics.creator); this matches the claim page.
   * Distributed = the holder pot actually paid out (sentRaw). Returns formatted
   * strings, or null when the pool's quote/decimals can't be read. */
  async function fetchRewardFees(rec) {
    var res = await Promise.all([
      fetch("/api/payouts?mint=" + encodeURIComponent(rec.mint))
        .then(function (r) { return r.json(); })
        .then(function (j) { return (j.payouts && j.payouts[rec.mint]) || null; })
        .catch(function () { return null; }),
      IS_EVM ? Promise.resolve(null)
             : window.Token.feeMetrics(rec.mint, rec.pool || null).catch(function () { return null; })
    ]);
    var pay = res[0], m = res[1];
    if (!m) return null;
    var q = m.quote || "SOL", dec = Math.pow(10, m.quoteDec);
    var distQuote = pay ? Number(pay.sentRaw) / dec : 0;
    var accruedQuote = (pay ? Number(pay.claimedRaw) / dec : 0) + (m.creator || 0);
    function inQuote() {
      return { accrued: UI.fmt(accruedQuote, 4) + " " + q,
               distributed: UI.fmt(distQuote, 4) + " " + q };
    }
    /* Holders are actually paid in the chosen REWARD asset — the keeper swaps
     * the quote into it — so show the figures in that asset. Fall back to the
     * quote when the reward IS the quote, it is a burn (no asset paid), or the
     * asset is not tradeable yet (the keeper pays the quote until it is). */
    var SOL = "So11111111111111111111111111111111111111112";
    var USDC = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v";
    var quoteMint = q === "USDC" ? USDC : SOL;
    var rm = rec.rewardMint;
    if (!rm || rm === quoteMint || rec.rewardMode === "burn") return inQuote();
    var rsym = rm === USDC ? "USDC" : (rm === SOL ? "SOL" : null);
    var tradeable = true;
    if (!rsym) {
      try {
        var list = await window.Token.rwa();
        var hit = (list || []).find(function (t) { return t.mint === rm; });
        rsym = hit && hit.symbol;
        tradeable = !!hit && (hit.liquidity || 0) >= 1000;
      } catch (e) {}
    }
    if (!rsym || !tradeable) return inQuote();
    // convert the quote-denominated pot into the reward asset via each side's
    // dollar price (server-priced, so no third-party call from the page)
    var prices = await Promise.all([
      fetch("/api/stats?usd=" + encodeURIComponent(q.toLowerCase()))
        .then(function (r) { return r.json(); }).then(function (j) { return j.usd; }).catch(function () { return null; }),
      fetch("/api/stats?usd=" + encodeURIComponent(rm))
        .then(function (r) { return r.json(); }).then(function (j) { return j.usd; }).catch(function () { return null; })
    ]);
    var qUsd = prices[0], rUsd = prices[1];
    if (!qUsd || !rUsd) return inQuote();               // no price → stay honest in the quote
    var f = qUsd / rUsd;                                // reward units per 1 quote unit
    return { accrued: "≈ " + UI.fmt(accruedQuote * f, 4) + " " + rsym,
             distributed: "≈ " + UI.fmt(distQuote * f, 4) + " " + rsym };
  }

  /* A paired launch links both ways. Someone who arrived at the token should
   * be one click from the collection its fees reward, and from where those
   * holders stake — otherwise the pairing is a fact in our database that
   * nobody can act on. */
  function loadPairedCollection() {
    fetch("/api/collections").then(function (r) { return r.json(); })
      .then(function (j) {
        var rec = (j.collections || []).find(function (c) { return c.tokenMint === MINT; });
        if (!rec || !rec.candyMachine) return;
        var el = $("pairlink");
        el.href = "/mint/" + rec.candyMachine;
        el.innerHTML =
          '<span class="c">' + (rec.avatar
            ? '<img alt="" src="' + esc(rec.avatar) + '">'
            : esc((rec.name || "?").slice(0, 1))) + "</span>" +
          "<span><b>" + esc(rec.name || "Paired collection") + "</b>" +
          '<span class="s">mint the collection →</span></span>' +
          '<span class="arw">→</span>';
        el.hidden = false;

        var st = $("stakelink");
        st.href = "/stake";
        st.innerHTML =
          '<span class="c">◈</span>' +
          "<span><b>Staking</b>" +
          '<span class="s">burn to stake, earn from trading fees</span></span>' +
          '<span class="arw">→</span>';
        st.hidden = false;
      }).catch(function () {});
  }

  async function load() {
    /* The record has to be read BEFORE the market, because it carries the pool
     * address. This was fire-and-forget, so readMarket ran with poolHint still
     * null and fell back to deriving the pool from the configs in brand.js — a
     * launch on any config not listed there then reported "No pool for that
     * mint" on its own trading page, with the address sitting in the record the
     * whole time.
     *
     * Identity still paints from the record as soon as it lands; only the pool
     * is waited on. */
    var recPromise = fetch("/api/tokens")
      .then(function (r) { return r.json(); })
      .then(function (j) {
        return (j.tokens || []).find(function (t) { return t.mint === MINT; }) || null;
      })
      .catch(function () { return null; });

    await Promise.resolve(recPromise).then(function (rec) {
      if (rec) {
        poolHint = rec.pool || null;
        $("name").firstChild.textContent = rec.name;
        $("sym").textContent = "$" + rec.symbol;
        /* Our index is a convenience, not the truth. The name and ticker a
         * token actually launched with live on its metadata account, so ask
         * the chain and let it win — a listing can be wrong, the mint cannot. */
        /* ⚠️ Not an early return. Everything below in load() — the art, the
         * market read, the chart, the trade box — runs after this, so bailing
         * out here on EVM would render a blank page. WavesToken carries only a
         * name and a symbol, both already in the record, so there is simply
         * nothing to ask the chain for. */
        if (IS_EVM) {
          renderLinks(null);
        } else {
          window.Token.onchainIdentity(MINT).then(function (id) {
            if (!id) return;
            if (id.name) $("name").firstChild.textContent = id.name;
            if (id.symbol) $("sym").textContent = "$" + id.symbol;
            if (!id.uri) return null;
            return fetch(id.uri).then(function (r) { return r.ok ? r.json() : null; });
          }).then(function (meta) {
            renderLinks(meta);
            if (meta && meta.description) $("desc").textContent = meta.description;
          }).catch(function () { renderLinks(null); });
        }
        /* Art is pinned to Arweave at launch, and the gateway can take a
         * while to serve a fresh upload — Turbo returns the id immediately but
         * the bundle is posted and seeded after. So a token is at its most
         * shared exactly when its images 404. Fall back to the letter tile and
         * retry quietly rather than showing a broken-image icon, and let the
         * art appear on its own once the gateway catches up. */
        if (rec.icon) {
          var lg = document.createElement("img");
          lg.alt = "";
          lg.onload = function () { $("logo").innerHTML = ""; $("logo").appendChild(lg); };
          lg.onerror = function () {
            var tries = 0;
            var retry = setInterval(function () {
              if (++tries > 10) return clearInterval(retry);   // ~5 minutes
              lg.src = art(rec.icon) + "&r=" + tries;
            }, 30000);
          };
          lg.src = art(rec.icon);
        }
        drawRewards(rec);
        if (rec.banner) {
          var bn = $("tbanner-img");
          bn.onload = function () { bn.hidden = false; };
          bn.onerror = function () { bn.hidden = true; };
          bn.src = art(rec.banner);
        }
      }
    }).catch(function () {});

    try {
      await tkReady;
      market = await tk.readMarket(MINT, poolHint);
    } catch (e) {
      $("name").firstChild.textContent = "Not found";
      say("err", esc(String(e.message)));
      return;
    }
    if ($("name").firstChild.textContent === "Loading…")
      $("name").firstChild.textContent = UI.shortAddr(MINT, 4);
    $("s-price").textContent = market.price ? market.price.toFixed(9) : "—";
    $("s-raised").textContent = UI.fmt(market.raised, 2) + " " + market.quote;
    $("s-grad").textContent = UI.fmt(market.threshold, 0) + " " + market.quote;
    $("s-status").textContent = market.migrated ? "GRADUATED" : "on the curve";
    $("bar").style.width = (market.progress * 100).toFixed(1) + "%";
    $("pct").textContent = (market.progress * 100).toFixed(1) + "% to graduation";
    drawCurve(market.progress);
    QUOTE = market.quote || "SOL";
    // the rate, so a token the indexer has not seen still shows dollars
    if (USD == null) {
      try {
        /* On Robinhood the quote is ETH, which the stats endpoint prices from
         * Coinbase rather than Jupiter — Jupiter knows Solana mints and nothing
         * about another chain's native coin. Without this the page fell back to
         * raw ETH everywhere and never showed a dollar figure. */
        var ur = await fetch("/api/stats?usd=" + encodeURIComponent(IS_EVM ? "eth" : QUOTE.toLowerCase()))
          .then(function (r) { return r.json(); });
        if (ur && ur.usd) USD = ur.usd;
      } catch (e) {}
    }

    /* Fill the stats from the chain immediately.
     *
     * The indexer runs on a ten-minute cron, so a token launched a minute ago
     * has no indexed history — but the curve knows its price right now, and the
     * mint knows its supply, so price, market cap and graduation progress need
     * nobody's permission. loadStats() overwrites these with indexed figures
     * (24h volume, ATH, holders, the chart) the moment it has them.
     *
     * Before this, a brand new token showed dashes in every box at exactly the
     * moment its creator was showing it to people. */
    if (market.price != null) {
      $("s-price").textContent = USD ? money(market.price * USD) : market.price.toPrecision(3);
    }
    if (market.mcap != null) {
      $("s-mcap").textContent = USD ? money(market.mcap * USD) : native(market.mcap);
      if (market.supply) $("s-supply").textContent = UI.fmt(market.supply, 0) + " supply";
    }
    $("s-raised").textContent = USD ? money(market.raised * USD) : native(market.raised);
    $("s-raised-n").textContent = native(market.raised);
    $("s-grad").textContent = USD ? money(market.threshold * USD) : native(market.threshold, 0);
    $("s-grad-n").textContent = native(market.threshold, 0);
    if ($("s-vol").textContent === "—") $("s-vol").textContent = USD ? money(0) : native(0);
    if ($("s-trades").textContent === "") $("s-trades").textContent = "0 trades";
    /* Indexed history if we have it, the chain if we do not — a token launched
     * between cron runs still shows its trades. */
    loadStats().then(function (ok) { if (!ok) loadTrades(); });
    loadPairedCollection();

    if (market.migrated) {
      $("go").textContent = "Trade on Jupiter ↗";
      $("go").disabled = false;
      $("go").onclick = function () {
        window.open("https://jup.ag/swap/SOL-" + MINT, "_blank", "noopener");
      };
      return;
    }
    armTradeBox();
  }

  /* The price curve, drawn as the constant-product virtual pool actually
   * behaves: price rises smoothly to the graduation point. X is progress
   * toward the raise target, Y is relative price; the dot is where the pool
   * is NOW. Deterministic from state — no indexer, no candles, no pretending. */
  /* The price chart, built from the trades themselves.
   *
   * Every trade carries both sides — SOL in or out and tokens out or in — so
   * its price is simply one divided by the other. Plotting those in order is
   * a real price history, from the same reads that fill the trades panel. No
   * indexer, no third party, and it is honest: if a token has two trades, it
   * draws two points and says so rather than inventing a line.
   *
   * The theoretical curve stays as the fallback for a token that has not
   * traded yet — a brand new launch should still show its shape. */
  function drawPrice(points) {
    var cv = $("curve"), dpr = window.devicePixelRatio || 1;
    var W = cv.clientWidth, H = cv.clientHeight || 400;
    cv.width = W * dpr; cv.height = H * dpr;
    var g = cv.getContext("2d");
    g.scale(dpr, dpr);
    var padL = 8, padR = 62, padT = 14, padB = 22;
    var w = W - padL - padR, h = H - padT - padB;

    var lo = Math.min.apply(null, points.map(function (p) { return p.price; }));
    var hi = Math.max.apply(null, points.map(function (p) { return p.price; }));
    if (!(hi > lo)) { hi = lo * 1.08 || 1; lo = lo * 0.92 || 0; }
    var t0 = points[0].at, t1 = points[points.length - 1].at;
    var span = Math.max(1, t1 - t0);
    function xy(p) {
      return [padL + ((p.at - t0) / span) * w,
              padT + h - ((p.price - lo) / (hi - lo)) * h];
    }

    /* Label the axis in market cap, not raw price.
     *
     * A launch token's price is "2.87e-8", which is a number nobody holds in
     * their head and cannot be compared to anything. The same point as a market
     * cap — $28.7K — is immediately meaningful, and it is the figure every
     * other terminal charts. Supply is fixed, so it is the same curve either
     * way, just readable. Falls back to price if we do not know the supply or
     * the rate yet. */
    function axisLabel(price) {
      if (market && market.supply && USD) return money(price * market.supply * USD);
      if (USD) return money(price * USD);
      return price.toPrecision(3);
    }

    var cs = getComputedStyle(document.documentElement);
    var GA = cs.getPropertyValue("--grad-a").trim() || "#9945FF";
    var GB = cs.getPropertyValue("--grad-b").trim() || "#14F195";
    var ARGB = cs.getPropertyValue("--accent-rgb").trim() || "20,241,149";

    // horizontal guides, labelled at the right like the reference
    g.font = '10px "IBM Plex Mono", monospace';
    g.textAlign = "left";
    g.textBaseline = "middle";
    [0, .5, 1].forEach(function (f) {
      var y = padT + h - f * h;
      g.beginPath(); g.setLineDash([3, 4]);
      g.moveTo(padL, y); g.lineTo(padL + w, y);
      g.strokeStyle = "rgba(255,255,255,.07)"; g.lineWidth = 1; g.stroke();
      g.setLineDash([]);
      g.fillStyle = "rgba(255,255,255,.34)";
      g.fillText(axisLabel(lo + (hi - lo) * f), padL + w + 8, y);
    });

    /* The area carries the same gradient as the line.
     *
     * It used to be a single accent colour fading down, so the line ran
     * purple to green above a fill that was green everywhere — two different
     * charts stacked on each other. Canvas gradients only run along one axis,
     * so this fills horizontally in the brand gradient and then erases
     * downward with destination-out, which gives the fade without needing a
     * second colour stop system. */
    var pts = points.map(xy);
    g.save();
    g.beginPath();
    g.moveTo(pts[0][0], padT + h);
    pts.forEach(function (p) { g.lineTo(p[0], p[1]); });
    g.lineTo(pts[pts.length - 1][0], padT + h);
    g.closePath();
    g.clip();

    var across = g.createLinearGradient(padL, 0, padL + w, 0);
    across.addColorStop(0, GA);
    across.addColorStop(1, GB);
    g.globalAlpha = 0.32;
    g.fillStyle = across;
    g.fillRect(padL, padT, w, h);

    // fade it toward the baseline
    g.globalAlpha = 1;
    g.globalCompositeOperation = "destination-out";
    var fade = g.createLinearGradient(0, padT, 0, padT + h);
    fade.addColorStop(0, "rgba(0,0,0,0)");
    fade.addColorStop(1, "rgba(0,0,0,1)");
    g.fillStyle = fade;
    g.fillRect(padL, padT, w, h);
    g.restore();

    // the line
    var line = g.createLinearGradient(padL, 0, padL + w, 0);
    line.addColorStop(0, GA); line.addColorStop(1, GB);
    g.beginPath();
    pts.forEach(function (p, i) { i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); });
    g.strokeStyle = line; g.lineWidth = 2.5;
    g.lineJoin = "round"; g.lineCap = "round";
    g.stroke();

    // where it is now
    var last = pts[pts.length - 1];
    g.beginPath(); g.arc(last[0], last[1], 4.5, 0, 7);
    g.fillStyle = GB; g.fill();
    // a soft halo so the head of the line reads as "now" rather than a full stop
    g.beginPath(); g.arc(last[0], last[1], 9, 0, 7);
    g.fillStyle = "rgba(" + ARGB + ",.18)"; g.fill();

    // time range along the bottom
    g.fillStyle = "rgba(255,255,255,.34)";
    g.textBaseline = "alphabetic";
    var fmtT = function (ms) {
      var d = new Date(ms);
      return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    };
    g.fillText(fmtT(t0), padL, H - 6);
    g.textAlign = "right";
    g.fillText(fmtT(t1), padL + w, H - 6);
  }

  function drawCurve(progress) {
    var cv = $("curve"), dpr = window.devicePixelRatio || 1;
    var W = cv.clientWidth, H = 400;
    cv.width = W * dpr; cv.height = H * dpr;
    var g = cv.getContext("2d");
    g.scale(dpr, dpr);
    var pad = 10, w = W - pad * 2, h = H - pad * 2;
    function xy(t) {
      var y = Math.pow(t, 1.9);                    // virtual-pool price growth shape
      return [pad + t * w, pad + h - y * h * 0.92 - h * 0.04];
    }
    // curve
    g.beginPath();
    for (var t = 0; t <= 1.001; t += 0.01) {
      var p = xy(Math.min(t, 1));
      t === 0 ? g.moveTo(p[0], p[1]) : g.lineTo(p[0], p[1]);
    }
    g.strokeStyle = "rgba(255,255,255,.16)"; g.lineWidth = 2; g.stroke();
    // travelled portion in gradient — canvas can't parse var(), so the
    // chain skin's endpoints come off the computed style
    var cs = getComputedStyle(document.documentElement);
    var GA = cs.getPropertyValue("--grad-a").trim() || "#9945FF";
    var GB = cs.getPropertyValue("--grad-b").trim() || "#14F195";
    var ARGB = cs.getPropertyValue("--accent-rgb").trim() || "20,241,149";
    var grad = g.createLinearGradient(pad, 0, pad + w, 0);
    grad.addColorStop(0, GA); grad.addColorStop(1, GB);
    g.beginPath();
    for (var t2 = 0; t2 <= progress + 0.001; t2 += 0.01) {
      var p2 = xy(Math.min(t2, progress));
      t2 === 0 ? g.moveTo(p2[0], p2[1]) : g.lineTo(p2[0], p2[1]);
    }
    g.strokeStyle = grad; g.lineWidth = 3; g.stroke();
    // the dot: where this pool is now
    var d = xy(progress);
    g.beginPath(); g.arc(d[0], d[1], 6, 0, 7);
    g.fillStyle = GB; g.fill();
    g.beginPath(); g.arc(d[0], d[1], 11, 0, 7);
    g.strokeStyle = "rgba(" + ARGB + ",.35)"; g.stroke();
  }

  function armTradeBox() {
    $("t-buy").onclick = function () { setSide("buy"); };
    $("t-sell").onclick = function () { setSide("sell"); };
    $("chips").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-v],button[data-p]");
      if (!b) return;
      if (b.dataset.v) { $("amt").value = b.dataset.v; requote(); return; }
      // sell chips are a percentage of what the wallet actually holds
      if (!currentWallet()) { say("err", "Connect a wallet to size a sell."); return; }
      tkReady.then(function () { return tk.balanceOf(MINT); }).then(function (bal) {
        if (!bal) { say("err", "This wallet holds none of this token."); return; }
        var amt = Math.floor(bal * (+b.dataset.p / 100) * 1e6) / 1e6;
        $("amt").value = amt; say("", ""); requote();
      }).catch(function (err) {
        say("err", esc(String(err.message).slice(0, 120)));
      });
    });
    $("amt").addEventListener("input", requote);
    /* ⚠️ Draw the buy side once, rather than waiting for a click.
     *
     * setSide() is what puts the right currency on the label, and it was only
     * ever reached by clicking a tab — so a page opened fresh sat on whatever
     * the static HTML said, which was SOL. Every Robinhood token asked for an
     * "Amount (SOL)" and then spent ETH. */
    setSide("buy");
  }

  function setSide(s) {
    side = s;
    $("t-buy").className = s === "buy" ? "on buy" : "buy";
    $("t-sell").className = s === "sell" ? "on sell" : "sell";
    $("amt-label").textContent = s === "buy"
      ? (IS_EVM ? "Amount (ETH)" : "Amount (SOL)") : "Amount (tokens)";
    $("chips").innerHTML = s === "buy"
      ? '<button data-v="0.01">0.01</button><button data-v="0.025">0.025</button><button data-v="0.05">0.05</button><button data-v="0.1">0.1</button>'
      : '<button data-p="10">10%</button><button data-p="25">25%</button><button data-p="50">50%</button><button data-p="100">100%</button>';
    $("est").textContent = "—"; lastQuote = null; requote(); paintGo();
  }

  var qTimer = null;
  function requote() {
    clearTimeout(qTimer);
    qTimer = setTimeout(async function () {
      var amt = parseFloat($("amt").value);
      if (!(amt > 0)) { $("est").textContent = "—"; lastQuote = null; paintGo(); return; }
      var seq = ++quoteSeq;
      try {
        await tkReady;
        var q = await tk.getQuote(MINT, amt, side, poolHint);
        if (seq !== quoteSeq) return;              // a newer quote superseded this one
        lastQuote = q;
        $("est").textContent = UI.fmt(q.out, side === "buy" ? 0 : 4) +
          (side === "buy" ? " tokens" : (IS_EVM ? " ETH" : " SOL"));
      } catch (e) {
        if (seq !== quoteSeq) return;
        lastQuote = null; $("est").textContent = "—";
        say("err", esc(String(e.message).slice(0, 120)));
      }
      paintGo();
    }, 350);
  }

  function paintGo() {
    var w = currentWallet();
    var go = $("go");
    go.disabled = false;
    if (!w) { go.textContent = "Connect wallet"; go.onclick = connect; return; }
    if (!lastQuote) { go.textContent = side === "buy" ? "Buy" : "Sell"; go.disabled = true; return; }
    go.textContent = side === "buy" ? "Buy" : "Sell";
    go.onclick = trade;
  }

  async function connect() {
    var w = await Shell.connect();
    if (w) { paintGo(); }
  }

  /* Same as the mint page: the shell restores an existing session on load and
   * that lands after this page has drawn, so the trade box has to redraw when
   * the wallet turns up rather than only when someone clicks Connect. */
  if (IS_EVM) {
    // evm-wallet.js dispatches this when an account connects or changes
    window.addEventListener("moonpad-wallet", function () { armTradeBox(); });
  } else if (window.Wallet) {
    window.Wallet.on("change", function () { armTradeBox(); });
  }

  async function trade() {
    var go = $("go");
    go.disabled = true; go.textContent = "Confirm in your wallet…";
    say("", "");
    try {
      await tkReady;
      var sig = await tk.swap(MINT, side, lastQuote.amountIn, lastQuote.minOut, poolHint);
      var txUrl = IS_EVM ? tk.txUrl(sig) : "https://explorer.solana.com/tx/" + sig;
      say("ok", (side === "buy" ? "Bought." : "Sold.") +
        ' <a href="' + esc(txUrl) + '" target="_blank" rel="noopener">View tx ↗</a>');
      // Clear the amount once it has actually traded. Leaving the old number
      // sitting there invites a second trade nobody meant to make, and the
      // quote beside it is stale the moment the curve moves.
      $("amt").value = "";
      lastQuote = null;
      $("est").textContent = "—";
      /* Index this trade before reloading, so the chart, volume and feed show
       * it now rather than at the next ten-minute cron. A person who just
       * bought and sees nothing change assumes the page is broken. */
      fetch("/api/indexer?mint=" + encodeURIComponent(MINT))
        .catch(function () {})
        .then(function () { load(); });
    } catch (e) {
      var m = String(e.message || e);
      if (/reject/i.test(m)) m = "You cancelled the transaction.";
      say("err", esc(m.slice(0, 160)));
    }
    go.disabled = false; paintGo();
  }
})();
</script>
</body>
</html>
